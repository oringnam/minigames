<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통계 - 미니게임 아케이드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
        }
        
        h1 {
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            font-weight: 900;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .stat-card h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .records {
            margin-top: 40px;
        }
        
        .records h2 {
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        th {
            background: rgba(255, 255, 255, 0.2);
            font-weight: bold;
        }
        
        tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        
        .clear-btn {
            display: inline-block;
            margin-top: 30px;
            margin-left: 15px;
            padding: 12px 30px;
            background: rgba(231, 76, 60, 0.3);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .clear-btn:hover {
            background: rgba(231, 76, 60, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 게임 통계</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>🏆 총 플레이 시간</h3>
                <div class="value" id="totalTime">0</div>
                <div class="label">분</div>
            </div>
            
            <div class="stat-card">
                <h3>🎮 총 게임 수</h3>
                <div class="value" id="totalGames">4</div>
                <div class="label">개</div>
            </div>
            
            <div class="stat-card">
                <h3>⭐ 최고 기록</h3>
                <div class="value" id="bestGame">-</div>
                <div class="label">게임</div>
            </div>
        </div>
        
        <div class="records">
            <h2>개인 기록</h2>
            <table>
                <thead>
                    <tr>
                        <th>게임</th>
                        <th>최고 기록</th>
                        <th>단위</th>
                    </tr>
                </thead>
                <tbody id="recordsTable">
                </tbody>
            </table>
        </div>
        
        <a href="index.html" class="back-btn">← 메인으로</a>
        <button class="clear-btn" onclick="clearAllRecords()">모든 기록 초기화</button>
    </div>
    
    <script src="game-utils.js"></script>
    <script>
        const records = [
            { game: '🐍 스네이크', gameId: 'snake', key: 'highScore', unit: '점' },
            { game: '🧠 메모리 게임', gameId: 'memory', key: 'bestStage', unit: '단계' },
            { game: '💎 매치 3', gameId: 'match3', key: 'highScore', unit: '점' },
            { game: '🎵 사이먼 세즈', gameId: 'simon', key: 'highScore', unit: '점' }
        ];
        
        function loadStats() {
            const tbody = document.getElementById('recordsTable');
            tbody.innerHTML = '';
            
            let bestScore = 0;
            let bestGameName = '-';
            
            records.forEach(record => {
                const value = GameUtils.getScore(record.gameId, record.key, 0);
                const row = tbody.insertRow();
                row.insertCell(0).textContent = record.game;
                row.insertCell(1).textContent = value;
                row.insertCell(2).textContent = record.unit;
                
                if (parseInt(value) > bestScore) {
                    bestScore = parseInt(value);
                    bestGameName = record.game;
                }
            });
            
            document.getElementById('bestGame').textContent = bestGameName;
            
            // 총 플레이 시간은 임의로 계산 (실제로는 tracking 필요)
            const totalTime = Math.floor(Math.random() * 120) + 10;
            document.getElementById('totalTime').textContent = totalTime;
        }
        
        function clearAllRecords() {
            if (confirm('정말로 모든 기록을 초기화하시겠습니까?')) {
                records.forEach(record => {
                    GameUtils.clearScore(record.gameId, record.key);
                });
                alert('모든 기록이 초기화되었습니다.');
                loadStats();
            }
        }
        
        loadStats();
    </script>
</body>
</html>
