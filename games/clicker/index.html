<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠키 클리커</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #d35400;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .cookie-count {
            font-size: 3em;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 30px;
        }
        
        .cookie-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            border: none;
            font-size: 5em;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            margin-bottom: 40px;
        }
        
        .cookie-button:active {
            transform: scale(0.95);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
        }
        
        .stat-box {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 10px;
            flex: 1;
        }
        
        .stat-box h3 {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-box p {
            font-size: 1.5em;
            font-weight: bold;
            color: #e67e22;
        }
        
        .upgrades {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .upgrade {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .upgrade:hover:not(.locked) {
            background: #e67e22;
            color: white;
            transform: translateY(-3px);
        }
        
        .upgrade.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .upgrade h4 {
            font-size: 1.2em;
            margin-bottom: 5px;
        }
        
        .upgrade .cost {
            font-size: 0.9em;
            color: #e67e22;
        }
        
        .upgrade:hover:not(.locked) .cost {
            color: white;
        }
        
        .upgrade .owned {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }
        
        .back-btn {
            padding: 12px 30px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: #d35400;
        }
        
        .floating-number {
            position: absolute;
            font-size: 2em;
            font-weight: bold;
            color: #e67e22;
            pointer-events: none;
            animation: float-up 1s ease-out;
        }
        
        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍪 쿠키 클리커</h1>
        
        <div class="cookie-count" id="cookieCount">0 쿠키</div>
        
        <button class="cookie-button" id="cookieButton" onclick="clickCookie(event)">🍪</button>
        
        <div class="stats">
            <div class="stat-box">
                <h3>초당 쿠키</h3>
                <p id="perSecond">0</p>
            </div>
            <div class="stat-box">
                <h3>클릭당 쿠키</h3>
                <p id="perClick">1</p>
            </div>
            <div class="stat-box">
                <h3>총 클릭</h3>
                <p id="totalClicks">0</p>
            </div>
        </div>
        
        <h2 style="margin-bottom: 20px; color: #d35400;">업그레이드</h2>
        <div class="upgrades" id="upgrades"></div>
        
        <a href="../../index.html" class="back-btn">← 메인으로</a>
    </div>
    
    <script>
        let cookies = 0;
        let cookiesPerClick = 1;
        let cookiesPerSecond = 0;
        let totalClicks = 0;
        
        const upgrades = [
            { name: '커서', icon: '👆', baseCost: 10, owned: 0, cps: 0.1, multiplier: 1.15 },
            { name: '할머니', icon: '👵', baseCost: 100, owned: 0, cps: 1, multiplier: 1.15 },
            { name: '농장', icon: '🌾', baseCost: 500, owned: 0, cps: 5, multiplier: 1.15 },
            { name: '공장', icon: '🏭', baseCost: 3000, owned: 0, cps: 20, multiplier: 1.15 },
            { name: '은행', icon: '🏦', baseCost: 10000, owned: 0, cps: 100, multiplier: 1.15 },
            { name: '마법사', icon: '🧙', baseCost: 50000, owned: 0, cps: 500, multiplier: 1.15 }
        ];
        
        function updateDisplay() {
            document.getElementById('cookieCount').textContent = Math.floor(cookies).toLocaleString() + ' 쿠키';
            document.getElementById('perSecond').textContent = cookiesPerSecond.toFixed(1);
            document.getElementById('perClick').textContent = cookiesPerClick;
            document.getElementById('totalClicks').textContent = totalClicks;
            
            renderUpgrades();
        }
        
        function renderUpgrades() {
            const container = document.getElementById('upgrades');
            container.innerHTML = '';
            
            upgrades.forEach((upgrade, index) => {
                const cost = Math.floor(upgrade.baseCost * Math.pow(upgrade.multiplier, upgrade.owned));
                const canAfford = cookies >= cost;
                
                const div = document.createElement('div');
                div.className = 'upgrade' + (canAfford ? '' : ' locked');
                div.innerHTML = `
                    <h4>${upgrade.icon} ${upgrade.name}</h4>
                    <div class="cost">비용: ${cost.toLocaleString()}</div>
                    <div class="owned">보유: ${upgrade.owned} | +${upgrade.cps}/초</div>
                `;
                
                if (canAfford) {
                    div.onclick = () => buyUpgrade(index);
                }
                
                container.appendChild(div);
            });
        }
        
        function clickCookie(event) {
            cookies += cookiesPerClick;
            totalClicks++;
            
            // 플로팅 넘버
            const rect = event.target.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            const floatingNum = document.createElement('div');
            floatingNum.className = 'floating-number';
            floatingNum.textContent = '+' + cookiesPerClick;
            floatingNum.style.left = (event.clientX) + 'px';
            floatingNum.style.top = (event.clientY) + 'px';
            document.body.appendChild(floatingNum);
            
            setTimeout(() => floatingNum.remove(), 1000);
            
            updateDisplay();
        }
        
        function buyUpgrade(index) {
            const upgrade = upgrades[index];
            const cost = Math.floor(upgrade.baseCost * Math.pow(upgrade.multiplier, upgrade.owned));
            
            if (cookies >= cost) {
                cookies -= cost;
                upgrade.owned++;
                cookiesPerSecond += upgrade.cps;
                updateDisplay();
            }
        }
        
        // 자동 쿠키 생성
        setInterval(() => {
            cookies += cookiesPerSecond / 10;
            updateDisplay();
        }, 100);
        
        // 5개 이상 업그레이드 구매 시 클릭 파워 증가
        setInterval(() => {
            const totalUpgrades = upgrades.reduce((sum, u) => sum + u.owned, 0);
            cookiesPerClick = 1 + Math.floor(totalUpgrades / 5);
        }, 1000);
        
        updateDisplay();
    </script>
</body>
</html>
