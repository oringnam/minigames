<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브레이크아웃</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #ee0979;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2em;
        }
        
        .info {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        .info span {
            font-weight: bold;
            color: #ee0979;
        }
        
        canvas {
            border: 3px solid #ee0979;
            border-radius: 10px;
            background: #1a1a1a;
            cursor: none;
        }
        
        .controls {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
        
        .back-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #ee0979;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: #ff6a00;
        }
        
        .message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(238, 9, 121, 0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .message h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .message button {
            padding: 15px 40px;
            background: white;
            color: #ee0979;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
    <script src="../../mobile-controls.js"></script>
</head>
<body>
    <div class="container">
        <h1>🎯 브레이크아웃</h1>
        <div class="game-info">
            <div class="info">점수: <span id="score">0</span></div>
            <div class="info">라이프: <span id="lives">3</span></div>
            <div class="info">레벨: <span id="level">1</span></div>
        </div>
        <canvas id="gameCanvas" width="480" height="600"></canvas>
        <div class="controls">
            마우스로 패들 이동 | 스페이스바로 시작/일시정지
        </div>
        <a href="../../index.html" class="back-btn">← 메인으로</a>
    </div>
    
    <div class="message" id="message">
        <h2 id="messageTitle">게임 오버!</h2>
        <p id="messageText">점수: 0</p>
        <button onclick="startGame()">다시 시작</button>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            width: 100,
            height: 15,
            speed: 8
        };
        
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            dx: 0,
            dy: 0,
            speed: 5
        };
        
        let bricks = [];
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = false;
        let paused = false;
        let mouseX = canvas.width / 2;
        
        const BRICK_ROWS = 5;
        const BRICK_COLS = 8;
        const BRICK_WIDTH = 55;
        const BRICK_HEIGHT = 20;
        const BRICK_PADDING = 5;
        const BRICK_OFFSET_TOP = 50;
        const BRICK_OFFSET_LEFT = 10;
        
        const BRICK_COLORS = ['#e74c3c', '#e67e22', '#f39c12', '#2ecc71', '#3498db'];
        
        function initBricks() {
            bricks = [];
            for (let r = 0; r < BRICK_ROWS; r++) {
                bricks[r] = [];
                for (let c = 0; c < BRICK_COLS; c++) {
                    bricks[r][c] = {
                        x: c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT,
                        y: r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP,
                        status: 1,
                        color: BRICK_COLORS[r]
                    };
                }
            }
        }
        
        function drawBricks() {
            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    const brick = bricks[r][c];
                    if (brick.status === 1) {
                        ctx.fillStyle = brick.color;
                        ctx.fillRect(brick.x, brick.y, BRICK_WIDTH, BRICK_HEIGHT);
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.fillRect(brick.x, brick.y, BRICK_WIDTH, BRICK_HEIGHT / 3);
                    }
                }
            }
        }
        
        function drawPaddle() {
            ctx.fillStyle = '#3498db';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height / 3);
        }
        
        function drawBall() {
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(ball.x - 2, ball.y - 2, ball.radius / 3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function collisionDetection() {
            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    const brick = bricks[r][c];
                    if (brick.status === 1) {
                        if (ball.x > brick.x &&
                            ball.x < brick.x + BRICK_WIDTH &&
                            ball.y > brick.y &&
                            ball.y < brick.y + BRICK_HEIGHT) {
                            ball.dy = -ball.dy;
                            brick.status = 0;
                            score += (5 - r) * 10;
                            document.getElementById('score').textContent = score;
                            
                            // 모든 벽돌 깨면 다음 레벨
                            if (bricks.every(row => row.every(b => b.status === 0))) {
                                levelUp();
                            }
                        }
                    }
                }
            }
        }
        
        function levelUp() {
            level++;
            ball.speed += 0.5;
            document.getElementById('level').textContent = level;
            resetBall();
            initBricks();
            showMessage('레벨 업!', `레벨 ${level} 시작!`);
            setTimeout(() => {
                hideMessage();
                gameRunning = true;
            }, 2000);
        }
        
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = 0;
            ball.dy = 0;
            gameRunning = false;
        }
        
        function loseLife() {
            lives--;
            document.getElementById('lives').textContent = lives;
            
            if (lives === 0) {
                showMessage('게임 오버!', `최종 점수: ${score}`);
            } else {
                resetBall();
            }
        }
        
        function update() {
            if (!gameRunning || paused) return;
            
            // 공 이동
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // 벽 충돌
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }
            
            // 바닥
            if (ball.y + ball.radius > canvas.height) {
                loseLife();
                return;
            }
            
            // 패들 충돌
            if (ball.y + ball.radius > paddle.y &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width) {
                // 패들의 어디에 맞았는지에 따라 각도 변경
                const hitPos = (ball.x - paddle.x) / paddle.width;
                ball.dx = (hitPos - 0.5) * ball.speed * 2;
                ball.dy = -Math.abs(ball.dy);
            }
            
            collisionDetection();
        }
        
        function draw() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawBricks();
            drawPaddle();
            drawBall();
            
            update();
            requestAnimationFrame(draw);
        }
        
        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            paused = false;
            
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
            
            initBricks();
            resetBall();
            hideMessage();
        }
        
        function launchBall() {
            if (ball.dx === 0 && ball.dy === 0) {
                const angle = (Math.random() - 0.5) * Math.PI / 3;
                ball.dx = ball.speed * Math.sin(angle);
                ball.dy = -ball.speed * Math.cos(angle);
                gameRunning = true;
            }
        }
        
        function showMessage(title, text) {
            document.getElementById('messageTitle').textContent = title;
            document.getElementById('messageText').textContent = text;
            document.getElementById('message').style.display = 'block';
            gameRunning = false;
        }
        
        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, mouseX - paddle.width / 2));
        });
        
        canvas.addEventListener('click', launchBall);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (ball.dx === 0 && ball.dy === 0) {
                    launchBall();
                } else {
                    paused = !paused;
                }
            }
        });
        
        startGame();
        draw();
        
        // Mobile controls
        if (isMobile()) {
            const joystick = new VirtualJoystick(null, {
                position: 'bottom-center',
                onChange: (direction) => {
                    paddle.x += direction.x * paddle.speed;
                    paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
                }
            });
            
            // Launch button
            new VirtualButton({
                label: '🚀',
                position: 'bottom-right',
                onPress: () => {
                    launchBall();
                }
            });
        }
    </script>
</body>
</html>
