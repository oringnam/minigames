<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이먼 세즈</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #141E30 0%, #243B55 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #243B55;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .score {
            font-size: 2em;
            margin-bottom: 30px;
            color: #243B55;
        }
        
        .score span {
            font-weight: bold;
            color: #e74c3c;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(2, 150px);
            grid-template-rows: repeat(2, 150px);
            gap: 15px;
            margin: 0 auto 30px;
            width: fit-content;
        }
        
        .button {
            width: 150px;
            height: 150px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }
        
        .button:active {
            transform: scale(0.95);
        }
        
        .button.red {
            background: #e74c3c;
        }
        
        .button.green {
            background: #2ecc71;
        }
        
        .button.blue {
            background: #3498db;
        }
        
        .button.yellow {
            background: #f39c12;
        }
        
        .button.lit {
            filter: brightness(1.5);
            transform: scale(1.05);
            box-shadow: 0 0 30px currentColor;
        }
        
        .button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .controls {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 30px;
            background: #243B55;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #141E30;
        }
        
        .message {
            margin-top: 20px;
            font-size: 1.2em;
            color: #e74c3c;
            font-weight: bold;
            min-height: 30px;
        }
        
        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(2, min(45vw, 140px));
                grid-template-rows: repeat(2, min(45vw, 140px));
                gap: 12px;
            }
            
            .button {
                width: 100%;
                height: 100%;
            }
        }
    </style>
    <script src="../../game-sounds.js"></script>
</head>
<body>
    <div class="container">
        <h1>🔴🟢🟡🔵 사이먼 세즈</h1>
        
        <div class="score">
            레벨: <span id="level">0</span> | 최고: <span id="highScore">0</span>
        </div>
        
        <div class="game-board">
            <div class="button red" data-color="0">🔴</div>
            <div class="button green" data-color="1">🟢</div>
            <div class="button yellow" data-color="2">🟡</div>
            <div class="button blue" data-color="3">🔵</div>
        </div>
        
        <div class="controls">
            순서를 기억하고 같은 순서로 클릭하세요!
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="btn-group">
            <button class="btn" onclick="startGame()">시작</button>
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <script>
        const buttons = document.querySelectorAll('.button');
        const messageEl = document.getElementById('message');
        const levelEl = document.getElementById('level');
        const highScoreEl = document.getElementById('highScore');
        
        let sequence = [];
        let playerSequence = [];
        let level = 0;
        let highScore = localStorage.getItem('simonHighScore') || 0;
        let isPlaying = false;
        let isPlayerTurn = false;
        
        highScoreEl.textContent = highScore;
        
        // 사운드
        const gameSounds = new GameSounds();
        
        const sounds = {
            0: 262, // C
            1: 330, // E
            2: 392, // G
            3: 494  // B
        };
        
        function playSound(freq, duration = 300) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = freq;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration / 1000);
        }
        
        function lightButton(index, isPlayerClick = false) {
            const button = buttons[index];
            button.classList.add('lit');
            playSound(sounds[index]);
            
            // 📳 플레이어가 클릭했을 때만 진동
            if (isPlayerClick) {
                vibrate(30);
            }
            
            setTimeout(() => {
                button.classList.remove('lit');
            }, 400);
        }
        
        function disableButtons() {
            buttons.forEach(btn => btn.classList.add('disabled'));
            isPlayerTurn = false;
        }
        
        function enableButtons() {
            buttons.forEach(btn => btn.classList.remove('disabled'));
            isPlayerTurn = true;
        }
        
        async function playSequence() {
            disableButtons();
            messageEl.textContent = '순서를 기억하세요...';
            
            for (let i = 0; i < sequence.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 600));
                lightButton(sequence[i]);
            }
            
            await new Promise(resolve => setTimeout(resolve, 800));
            messageEl.textContent = '당신 차례!';
            enableButtons();
        }
        
        function addToSequence() {
            const randomIndex = Math.floor(Math.random() * 4);
            sequence.push(randomIndex);
            level++;
            levelEl.textContent = level;
            
            if (level > highScore) {
                highScore = level;
                localStorage.setItem('simonHighScore', highScore);
                highScoreEl.textContent = highScore;
                
                // 🎵 신기록!
                gameSounds.play('powerup');
                vibrate([100, 50, 100]);
            }
            
            // 레벨 5, 10, 15... 마다 축하 사운드
            if (level % 5 === 0 && level > 0) {
                gameSounds.play('coin');
            }
        }
        
        function checkPlayerInput(index) {
            if (!isPlayerTurn || !isPlaying) return;
            
            lightButton(index, true); // 플레이어 클릭
            playerSequence.push(index);
            
            const currentStep = playerSequence.length - 1;
            
            if (playerSequence[currentStep] !== sequence[currentStep]) {
                // 🎵 오답!
                gameSounds.play('wrong');
                vibrate(200);
                gameOver();
                return;
            }
            
            if (playerSequence.length === sequence.length) {
                // 🎵 정답!
                gameSounds.play('success');
                vibrate([50, 30, 50]);
                
                playerSequence = [];
                messageEl.textContent = '정답! 다음 레벨...';
                disableButtons();
                
                setTimeout(() => {
                    addToSequence();
                    playSequence();
                }, 1500);
            }
        }
        
        function gameOver() {
            isPlaying = false;
            disableButtons();
            messageEl.textContent = `게임 오버! 최종 레벨: ${level}`;
            
            // 🎵 게임오버 사운드 (Web Audio + GameSounds)
            playSound(100, 500);
            gameSounds.play('gameover');
            vibrate([100, 50, 100, 50, 200]);
            
            // 복사 버튼
            setTimeout(() => {
                if (confirm(`게임 오버!\n\n🎯 최종 레벨: ${level}\n🏆 최고: ${highScore}\n\n📋 점수를 복사하시겠습니까?`)) {
                    shareScore();
                }
            }, 500);
        }
        
        function shareScore() {
            const text = `🔴🟢🟡🔵 사이먼 세즈\n\n🎯 레벨: ${level}\n🏆 최고: ${highScore}\n\n🎮 미니게임 아케이드\nhttps://oringnam.github.io/minigames/`;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('📋 클립보드에 복사되었습니다!');
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }
        
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                alert('📋 클립보드에 복사되었습니다!');
            } catch (err) {
                alert('복사 실패:\n\n' + text);
            }
            document.body.removeChild(textarea);
        }
        
        function startGame() {
            sequence = [];
            playerSequence = [];
            level = 0;
            isPlaying = true;
            
            levelEl.textContent = level;
            messageEl.textContent = '게임 시작!';
            
            // 🎵 시작 사운드
            gameSounds.play('click');
            
            setTimeout(() => {
                addToSequence();
                playSequence();
            }, 1000);
        }
        
        buttons.forEach((button, index) => {
            button.addEventListener('click', () => {
                checkPlayerInput(index);
            });
        });
    </script>
</body>
</html>
