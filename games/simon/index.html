<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이먼 세즈</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <script src="../../game-sounds.js"></script>
    <script src="../../game-utils.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #141E30 0%, #243B55 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #243B55;
            margin-bottom: 20px;
            font-size: 2em;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            margin: 20px auto;
            max-width: 350px;
            aspect-ratio: 1;
        }
        
        .button {
            aspect-ratio: 1;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            border: none;
        }
        
        .button:active {
            transform: scale(0.95);
        }
        
        .button.red {
            background: #e74c3c;
        }
        
        .button.green {
            background: #2ecc71;
        }
        
        .button.blue {
            background: #3498db;
        }
        
        .button.yellow {
            background: #f39c12;
        }
        
        .button.lit {
            filter: brightness(1.5);
            transform: scale(1.05);
            box-shadow: 0 0 30px currentColor;
        }
        
        .button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .message {
            min-height: 30px;
            font-size: 1.1em;
            color: #243B55;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .button {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔴🟢🟡🔵 사이먼 세즈</h1>
        
        <!-- 점수판 (GameUI로 생성) -->
        <div id="scoreBoard"></div>
        
        <div class="message" id="message">순서를 기억하고 따라하세요!</div>
        
        <div class="game-board">
            <button class="button red" data-color="0">🔴</button>
            <button class="button green" data-color="1">🟢</button>
            <button class="button yellow" data-color="2">🟡</button>
            <button class="button blue" data-color="3">🔵</button>
        </div>
        
        <div class="btn-group">
            <button class="btn" onclick="startGame()">시작</button>
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <script>
        const buttons = document.querySelectorAll('.button');
        const messageEl = document.getElementById('message');
        const sounds = new GameSounds();
        
        let sequence = [];
        let playerSequence = [];
        let level = 0;
        let highScore = GameUtils.getScore('simon', 'highScore', 0);
        let isPlaying = false;
        let isPlayerTurn = false;
        
        // 점수판 생성 (GameUI)
        const scoreBoard = GameUI.createScoreBoard({
            items: [
                { id: 'level', label: '레벨', value: 0 },
                { id: 'highScore', label: '최고', value: highScore }
            ],
            containerId: 'scoreBoard'
        });
        
        // 버튼 주파수
        const tones = {
            0: 262, // C
            1: 330, // E
            2: 392, // G
            3: 494  // B
        };
        
        function playTone(freq, duration = 300) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = freq;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration / 1000);
        }
        
        function lightButton(index, isPlayerClick = false) {
            const button = buttons[index];
            button.classList.add('lit');
            playTone(tones[index]);
            
            if (isPlayerClick) {
                vibrate(30);
            }
            
            setTimeout(() => {
                button.classList.remove('lit');
            }, 400);
        }
        
        function disableButtons() {
            buttons.forEach(btn => btn.classList.add('disabled'));
            isPlayerTurn = false;
        }
        
        function enableButtons() {
            buttons.forEach(btn => btn.classList.remove('disabled'));
            isPlayerTurn = true;
        }
        
        async function playSequence() {
            disableButtons();
            messageEl.textContent = '순서를 기억하세요...';
            
            for (let i = 0; i < sequence.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 600));
                lightButton(sequence[i]);
            }
            
            await new Promise(resolve => setTimeout(resolve, 800));
            messageEl.textContent = '당신 차례!';
            enableButtons();
        }
        
        function addToSequence() {
            const randomIndex = Math.floor(Math.random() * 4);
            sequence.push(randomIndex);
            level++;
            scoreBoard.update('level', level);
            
            if (level > highScore) {
                highScore = level;
                GameUtils.saveScore('simon', 'highScore', highScore);
                scoreBoard.update('highScore', highScore);
                sounds.play('powerup');
                vibrate([100, 50, 100]);
            }
            
            // 레벨 5, 10, 15... 마다 축하 사운드
            if (level % 5 === 0 && level > 0) {
                sounds.play('coin');
            }
        }
        
        function checkPlayerInput(index) {
            if (!isPlayerTurn || !isPlaying) return;
            
            lightButton(index, true);
            playerSequence.push(index);
            
            const currentStep = playerSequence.length - 1;
            
            if (playerSequence[currentStep] !== sequence[currentStep]) {
                sounds.play('wrong');
                vibrate(200);
                gameOver();
                return;
            }
            
            if (playerSequence.length === sequence.length) {
                sounds.play('success');
                vibrate([50, 30, 50]);
                
                playerSequence = [];
                messageEl.textContent = '정답! 다음 레벨...';
                disableButtons();
                
                setTimeout(() => {
                    addToSequence();
                    playSequence();
                }, 1500);
            }
        }
        
        function gameOver() {
            isPlaying = false;
            disableButtons();
            messageEl.textContent = '게임 오버!';
            
            playTone(100, 500);
            sounds.play('gameover');
            vibrate([100, 50, 100, 50, 200]);
            
            // 모달 표시 (GameUtils)
            setTimeout(() => {
                GameUtils.createModal({
                    title: '💀 게임 오버!',
                    stats: [
                        { label: '최종 레벨', value: level },
                        { label: '최고 레벨', value: highScore }
                    ],
                    buttons: [
                        {
                            text: '📱 카톡 공유',
                            action: () => {
                                const text = `🔴🟢🟡🔵 사이먼 세즈\n\n레벨: ${level}\n최고: ${highScore}\n\nhttps://oringnam.github.io/minigames/`;
                                GameUtils.copyToClipboard(text);
                            }
                        },
                        {
                            text: '다시 하기',
                            action: startGame
                        }
                    ]
                });
            }, 500);
        }
        
        function startGame() {
            sequence = [];
            playerSequence = [];
            level = 0;
            isPlaying = true;
            
            scoreBoard.update('level', 0);
            messageEl.textContent = '게임 시작!';
            sounds.play('click');
            
            setTimeout(() => {
                addToSequence();
                playSequence();
            }, 1000);
        }
        
        // 버튼 이벤트
        buttons.forEach((button, index) => {
            button.addEventListener('click', () => {
                checkPlayerInput(index);
            });
        });
    </script>
</body>
</html>
