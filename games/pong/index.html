<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퐁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #0f3460;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 2em;
            font-weight: bold;
        }
        
        .player-score {
            background: #f0f0f0;
            padding: 15px 40px;
            border-radius: 10px;
            color: #0f3460;
        }
        
        canvas {
            border: 3px solid #0f3460;
            border-radius: 10px;
            background: #000;
            cursor: none;
        }
        
        .controls {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 30px;
            background: #0f3460;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #16213e;
        }
        
        .win-message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 52, 96, 0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .win-message h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        .difficulty {
            margin-bottom: 20px;
        }
        
        .difficulty label {
            margin-right: 15px;
            color: #666;
        }
        
        .difficulty select {
            padding: 8px 15px;
            border-radius: 5px;
            border: 2px solid #0f3460;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
    <script src="../../mobile-controls.js"></script>
</head>
<body>
    <div class="container">
        <h1>🏓 퐁</h1>
        
        <div class="difficulty">
            <label for="difficulty">난이도:</label>
            <select id="difficulty" onchange="changeDifficulty()">
                <option value="easy">쉬움</option>
                <option value="medium" selected>보통</option>
                <option value="hard">어려움</option>
                <option value="insane">미친 난이도</option>
            </select>
        </div>
        
        <div class="score-board">
            <div class="player-score">플레이어: <span id="playerScore">0</span></div>
            <div class="player-score">AI: <span id="aiScore">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div class="controls">
            마우스 또는 화살표 위/아래로 패들 이동 | 5점 먼저 득점하면 승리!
        </div>
        
        <div class="btn-group">
            <button class="btn" onclick="resetGame()">새 게임</button>
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <div class="win-message" id="winMessage">
        <h2 id="winText">승리!</h2>
        <button class="btn" onclick="resetGame()" style="margin-top: 20px;">다시 시작</button>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const PADDLE_WIDTH = 10;
        const PADDLE_HEIGHT = 80;
        const BALL_SIZE = 10;
        const WINNING_SCORE = 5;
        
        let difficulty = 'medium';
        let aiSpeed = 4;
        
        const player = {
            x: 20,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            dy: 0
        };
        
        const ai = {
            x: canvas.width - 30,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT
        };
        
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: 4,
            dy: 4,
            size: BALL_SIZE,
            speed: 4
        };
        
        let playerScore = 0;
        let aiScore = 0;
        let mouseY = canvas.height / 2;
        
        function changeDifficulty() {
            difficulty = document.getElementById('difficulty').value;
            switch(difficulty) {
                case 'easy':
                    aiSpeed = 2.5;
                    ball.speed = 3;
                    break;
                case 'medium':
                    aiSpeed = 4;
                    ball.speed = 4;
                    break;
                case 'hard':
                    aiSpeed = 6;
                    ball.speed = 5;
                    break;
                case 'insane':
                    aiSpeed = 10;
                    ball.speed = 6;
                    break;
            }
            resetBall();
        }
        
        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }
        
        function drawCircle(x, y, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawNet() {
            for (let i = 0; i < canvas.height; i += 20) {
                drawRect(canvas.width / 2 - 2, i, 4, 10, '#333');
            }
        }
        
        function draw() {
            // 배경
            drawRect(0, 0, canvas.width, canvas.height, '#000');
            
            // 네트
            drawNet();
            
            // 패들
            drawRect(player.x, player.y, player.width, player.height, '#00ff00');
            drawRect(ai.x, ai.y, ai.width, ai.height, '#ff0000');
            
            // 공
            drawCircle(ball.x, ball.y, ball.size, '#fff');
            
            // 공 궤적 효과
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fff';
            drawCircle(ball.x, ball.y, ball.size, '#fff');
            ctx.shadowBlur = 0;
        }
        
        function update() {
            // 플레이어 이동 (마우스)
            player.y += (mouseY - player.y - player.height / 2) * 0.1;
            
            // 플레이어 키보드 이동
            player.y += player.dy;
            
            // 플레이어 경계
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;
            
            // AI 이동 (공을 따라감)
            const aiCenter = ai.y + ai.height / 2;
            if (aiCenter < ball.y - 20) {
                ai.y += aiSpeed;
            } else if (aiCenter > ball.y + 20) {
                ai.y -= aiSpeed;
            }
            
            // AI 경계
            if (ai.y < 0) ai.y = 0;
            if (ai.y + ai.height > canvas.height) ai.y = canvas.height - ai.height;
            
            // 공 이동
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // 위아래 벽 충돌
            if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
                ball.dy = -ball.dy;
            }
            
            // 패들 충돌
            let paddle = ball.dx < 0 ? player : ai;
            
            if (collision(ball, paddle)) {
                // 패들의 어디에 맞았는지에 따라 각도 조정
                const hitPos = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
                ball.dy = hitPos * ball.speed;
                
                ball.dx = -ball.dx;
                
                // 속도 증가
                if (Math.abs(ball.dx) < ball.speed * 2) {
                    ball.dx *= 1.05;
                }
            }
            
            // 득점
            if (ball.x - ball.size < 0) {
                aiScore++;
                document.getElementById('aiScore').textContent = aiScore;
                checkWin();
                resetBall();
            } else if (ball.x + ball.size > canvas.width) {
                playerScore++;
                document.getElementById('playerScore').textContent = playerScore;
                checkWin();
                resetBall();
            }
        }
        
        function collision(ball, paddle) {
            return ball.x - ball.size < paddle.x + paddle.width &&
                   ball.x + ball.size > paddle.x &&
                   ball.y - ball.size < paddle.y + paddle.height &&
                   ball.y + ball.size > paddle.y;
        }
        
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() - 0.5) * ball.speed;
        }
        
        function checkWin() {
            if (playerScore >= WINNING_SCORE) {
                document.getElementById('winText').textContent = '🎉 당신이 이겼습니다!';
                document.getElementById('winMessage').style.display = 'block';
            } else if (aiScore >= WINNING_SCORE) {
                document.getElementById('winText').textContent = '😢 AI가 이겼습니다!';
                document.getElementById('winMessage').style.display = 'block';
            }
        }
        
        function resetGame() {
            playerScore = 0;
            aiScore = 0;
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('aiScore').textContent = aiScore;
            document.getElementById('winMessage').style.display = 'none';
            resetBall();
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // 마우스 컨트롤
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseY = e.clientY - rect.top;
        });
        
        // 키보드 컨트롤
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                player.dy = -6;
            } else if (e.key === 'ArrowDown') {
                player.dy = 6;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                player.dy = 0;
            }
        });
        
        // 게임 시작
        gameLoop();
        
        // Mobile controls
        if (isMobile()) {
            const joystick = new VirtualJoystick(null, {
                position: 'bottom-left',
                onChange: (direction) => {
                    player.y += direction.y * 10;
                    player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
                }
            });
        }
    </script>
</body>
</html>
