<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, user-scalable=no">
    <title>스네이크 게임</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 20px 20px 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
            margin: 0 auto 20px auto;
        }
        
        h1 {
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            font-size: 2em;
            font-weight: 900;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
            gap: 10px;
        }
        
        .score, .high-score {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 8px 15px;
            border-radius: 12px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            flex: 1;
        }
        
        .score h3, .high-score h3 {
            font-size: 0.75em;
            opacity: 0.8;
        }
        
        .score span, .high-score span {
            font-weight: bold;
            font-size: 1.3em;
            display: block;
            margin-top: 3px;
        }
        
        canvas {
            border: none;
            border-radius: 20px;
            display: block;
            margin: 0 auto;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.15),
                inset 0 1px 0 rgba(255,255,255,0.8);
        }
        
        .controls {
            margin-top: 10px;
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 15px;
        }
        
        .back-btn {
            margin-top: 10px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 300px;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        
        /* 조이스틱 컨테이너 (게임 내부) */
        .joystick-wrapper {
            position: relative;
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
        }
        
        .joystick-container {
            position: relative;
            width: 160px;
            height: 160px;
            touch-action: none;
        }
        
        .joystick-container:not(.active) {
            opacity: 0.7;
        }
        
        .joystick-container.active {
            opacity: 1;
        }
        
        .joystick-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(80,80,80,0.9) 0%, 
                rgba(40,40,40,0.95) 100%);
            border: 4px solid rgba(60,60,60,0.8);
            box-shadow: 
                inset 0 -5px 15px rgba(0,0,0,0.5),
                0 5px 20px rgba(0,0,0,0.4);
        }
        
        .joystick-stick {
            position: absolute;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, 
                rgba(220,220,220,1) 0%, 
                rgba(160,160,160,1) 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 
                0 5px 15px rgba(0, 0, 0, 0.5),
                inset 0 2px 5px rgba(255,255,255,0.5);
            border: 2px solid rgba(100,100,100,0.6);
            transition: opacity 0.2s;
        }
        
        .joystick-container.active .joystick-stick {
            opacity: 1;
        }
        
        /* Mobile message */
        .mobile-hint {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 0.85em;
            z-index: 101;
            display: none;
            white-space: nowrap;
        }
        
        /* 파티클 */
        .particle {
            position: absolute;
            pointer-events: none;
        }
    </style>
    <script src="../../game-sounds.js"></script>
    <script src="../../game-utils.js"></script>
</head>
<body>
    <div class="container">
        <h1>🐍 스네이크</h1>
        <div id="scoreBoard"></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            화살표 키 또는 WASD로 이동 | 스페이스바로 일시정지
        </div>
        
        <!-- 조이스틱 (모바일만 표시) -->
        <div class="joystick-wrapper" id="joystickWrapper" style="display: none;">
            <div class="joystick-container" id="joystick">
                <div class="joystick-base"></div>
                <div class="joystick-stick" id="joystickStick"></div>
            </div>
        </div>
        
        <a href="../../index.html" class="back-btn">← 메인으로</a>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 모바일 세로 화면 최적화
        if (window.innerWidth < 768) {
            const maxSize = Math.min(window.innerWidth - 80, 320);
            canvas.width = maxSize;
            canvas.height = maxSize;
        }
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        // 사운드 & 이펙트
        const sounds = new GameSounds();
        const particles = new ParticleEffect(canvas, ctx);
        
        let snake = [{x: 10, y: 10, renderX: 10, renderY: 10}];
        let velocityX = 0;
        let velocityY = 0;
        let foodX = 15;
        let foodY = 15;
        let score = 0;
        let highScore = GameUtils.getScore('snake', 'highScore', 0);
        let gameLoop;
        let animationLoop;
        let paused = false;
        let moveProgress = 0;
        let lastMoveTime = 0;
        let MOVE_INTERVAL = 150; // 이동 간격 (ms)
        let isGameOver = false; // 게임오버 플래그
        
        // 점수판 생성 (GameUI)
        const scoreBoard = GameUI.createScoreBoard({
            items: [
                { id: 'score', label: '점수', value: 0 },
                { id: 'highScore', label: '최고', value: highScore }
            ],
            containerId: 'scoreBoard'
        });
        
        function updateGame(currentTime) {
            if (paused || isGameOver) return;
            
            // 이동 로직 (일정 간격마다)
            if (currentTime - lastMoveTime >= MOVE_INTERVAL && (velocityX !== 0 || velocityY !== 0)) {
                const head = {
                    x: snake[0].x + velocityX, 
                    y: snake[0].y + velocityY,
                    renderX: snake[0].x + velocityX,
                    renderY: snake[0].y + velocityY
                };
                
                // 벽 충돌 체크 (테두리 고려)
                if (head.x < 1 || head.x >= tileCount - 1 || head.y < 1 || head.y >= tileCount - 1) {
                    if (!isGameOver) gameOver();
                    return;
                }
                
                // 자기 자신 충돌 체크
                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        if (!isGameOver) gameOver();
                        return;
                    }
                }
                
                snake.unshift(head);
                
                // 먹이 먹기
                if (head.x === foodX && head.y === foodY) {
                    score++;
                    scoreBoard.update('score', score);
                    
                    sounds.coin();
                    vibrate(30);
                    particles.emit(
                        foodX * gridSize + gridSize/2,
                        foodY * gridSize + gridSize/2,
                        { count: 15, color: '#FFD700', speed: 4 }
                    );
                    
                    generateFood();
                    
                    if (score > highScore) {
                        highScore = score;
                        GameUtils.saveScore('snake', 'highScore', highScore);
                        scoreBoard.update('highScore', highScore);
                        sounds.powerup();
                    }
                } else {
                    snake.pop();
                }
                
                lastMoveTime = currentTime;
                moveProgress = 0;
            }
            
            // 진행도 계산 (부드러운 애니메이션용)
            if (velocityX !== 0 || velocityY !== 0) {
                moveProgress = Math.min(1, (currentTime - lastMoveTime) / MOVE_INTERVAL);
            }
        }
        
        function animate(currentTime) {
            updateGame(currentTime);
            draw();
            animationLoop = requestAnimationFrame(animate);
        }
        
        function draw() {
            // 배경
            ctx.fillStyle = '#f8f8f8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 액자 테두리 (두껍게)
            const borderWidth = gridSize;
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            
            ctx.fillStyle = gradient;
            // 상단
            ctx.fillRect(0, 0, canvas.width, borderWidth);
            // 하단
            ctx.fillRect(0, canvas.height - borderWidth, canvas.width, borderWidth);
            // 좌측
            ctx.fillRect(0, 0, borderWidth, canvas.height);
            // 우측
            ctx.fillRect(canvas.width - borderWidth, 0, borderWidth, canvas.height);
            
            // 테두리 안쪽 그림자 효과
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 3;
            ctx.strokeRect(borderWidth, borderWidth, canvas.width - borderWidth * 2, canvas.height - borderWidth * 2);
            
            // 파티클
            particles.update();
            
            // 뱀 그리기 (부드러운 보간)
            snake.forEach((segment, index) => {
                let renderX = segment.x;
                let renderY = segment.y;
                
                // 머리만 부드럽게 애니메이션
                if (index === 0 && moveProgress < 1) {
                    const prevX = segment.x - velocityX;
                    const prevY = segment.y - velocityY;
                    renderX = prevX + (segment.x - prevX) * moveProgress;
                    renderY = prevY + (segment.y - prevY) * moveProgress;
                }
                
                const x = renderX * gridSize;
                const y = renderY * gridSize;
                
                // 몸통 그라디언트
                const gradient = ctx.createLinearGradient(x, y, x + gridSize, y + gridSize);
                if (index === 0) {
                    gradient.addColorStop(0, '#667eea');
                    gradient.addColorStop(1, '#764ba2');
                } else {
                    gradient.addColorStop(0, '#3498db');
                    gradient.addColorStop(1, '#2980b9');
                }
                
                ctx.fillStyle = gradient;
                ctx.fillRect(x + 1, y + 1, gridSize - 3, gridSize - 3);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, gridSize - 5, gridSize - 5);
                
                // 머리 눈
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeOffset = 5;
                    const eyeSize = 4;
                    
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    ctx.arc(x + gridSize - eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset, y + eyeOffset, eyeSize/2, 0, Math.PI * 2);
                    ctx.arc(x + gridSize - eyeOffset, y + eyeOffset, eyeSize/2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            // 먹이 (애니메이션)
            const pulse = Math.sin(Date.now() / 200) * 2;
            ctx.fillStyle = '#e74c3c';
            ctx.shadowBlur = 10 + pulse;
            ctx.shadowColor = '#e74c3c';
            ctx.beginPath();
            ctx.arc(
                foodX * gridSize + gridSize/2, 
                foodY * gridSize + gridSize/2, 
                gridSize/2 - 2 + pulse, 
                0, Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function generateFood() {
            // 테두리 안쪽에만 생성 (1칸 여유)
            foodX = Math.floor(Math.random() * (tileCount - 2)) + 1;
            foodY = Math.floor(Math.random() * (tileCount - 2)) + 1;
            
            // 뱀과 겹치지 않게
            for (let segment of snake) {
                if (segment.x === foodX && segment.y === foodY) {
                    generateFood();
                    return;
                }
            }
        }
        
        function gameOver() {
            if (isGameOver) return; // 이미 게임오버 상태면 중복 실행 방지
            isGameOver = true;
            
            if (animationLoop) cancelAnimationFrame(animationLoop);
            sounds.gameover();
            vibrate([100, 50, 100]);
            shakeScreen(canvas, 8, 300);
            
            // 모달 표시 (GameUtils)
            setTimeout(() => {
                GameUtils.createModal({
                    title: '💀 게임 오버!',
                    stats: [
                        { label: '최종 점수', value: score },
                        { label: '최고 점수', value: highScore }
                    ],
                    buttons: [
                        {
                            text: '📱 카톡 공유',
                            action: () => {
                                const text = `🐍 스네이크\n\n점수: ${score}\n최고: ${highScore}\n\nhttps://oringnam.github.io/minigames/`;
                                GameUtils.copyToClipboard(text);
                            }
                        },
                        {
                            text: '다시 하기',
                            action: restartGame
                        }
                    ]
                });
            }, 300);
        }
        
        function restartGame() {
            snake = [{x: 10, y: 10, renderX: 10, renderY: 10}];
            velocityX = 0;
            velocityY = 0;
            score = 0;
            paused = false;
            moveProgress = 0;
            lastMoveTime = 0;
            isGameOver = false;
            scoreBoard.update('score', 0);
            generateFood();
            
            // 플레이 추적
            GameUtils.trackPlay('snake');
            GameUtils.startTimer('snake');
            
            if (animationLoop) cancelAnimationFrame(animationLoop);
            animationLoop = requestAnimationFrame(animate);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                paused = !paused;
                return;
            }
            
            // 반대 방향으로는 못 감
            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && velocityY !== 1) {
                velocityX = 0;
                velocityY = -1;
            } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && velocityY !== -1) {
                velocityX = 0;
                velocityY = 1;
            } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && velocityX !== 1) {
                velocityX = -1;
                velocityY = 0;
            } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && velocityX !== -1) {
                velocityX = 1;
                velocityY = 0;
            }
        });
        
        // 게임 시작
        generateFood();
        GameUtils.trackPlay('snake');
        GameUtils.startTimer('snake');
        animationLoop = requestAnimationFrame(animate);
        
        // 모바일 감지
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                || window.innerWidth < 768;
        }
        
        // Mobile controls (조이스틱 직접 구현)
        if (isMobile()) {
            const joystickWrapper = document.getElementById('joystickWrapper');
            const joystickContainer = document.getElementById('joystick');
            const joystickStick = document.getElementById('joystickStick');
            
            joystickWrapper.style.display = 'flex';
            
            let active = false;
            let centerX = 0;
            let centerY = 0;
            const maxDistance = 37; // 반지름 절반
            
            function updateStickPosition(x, y) {
                const dx = x - centerX;
                const dy = y - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                let limitedDx = dx;
                let limitedDy = dy;
                
                if (distance > maxDistance) {
                    limitedDx = (dx / distance) * maxDistance;
                    limitedDy = (dy / distance) * maxDistance;
                }
                
                joystickStick.style.transform = `translate(calc(-50% + ${limitedDx}px), calc(-50% + ${limitedDy}px))`;
                
                // 방향 결정
                const normalizedX = limitedDx / maxDistance;
                const normalizedY = limitedDy / maxDistance;
                
                if (distance > maxDistance * 0.4) {
                    const absX = Math.abs(normalizedX);
                    const absY = Math.abs(normalizedY);
                    
                    if (absX > absY * 1.2) {
                        if (normalizedX > 0 && velocityX !== -1) {
                            velocityX = 1;
                            velocityY = 0;
                        } else if (normalizedX < 0 && velocityX !== 1) {
                            velocityX = -1;
                            velocityY = 0;
                        }
                    } else if (absY > absX * 1.2) {
                        if (normalizedY > 0 && velocityY !== -1) {
                            velocityX = 0;
                            velocityY = 1;
                        } else if (normalizedY < 0 && velocityY !== 1) {
                            velocityX = 0;
                            velocityY = -1;
                        }
                    }
                }
            }
            
            function handleStart(e) {
                e.preventDefault();
                active = true;
                joystickContainer.classList.add('active');
                
                const rect = joystickContainer.getBoundingClientRect();
                centerX = rect.left + rect.width / 2;
                centerY = rect.top + rect.height / 2;
            }
            
            function handleMove(e) {
                if (!active) return;
                e.preventDefault();
                
                const touch = e.touches ? e.touches[0] : e;
                updateStickPosition(touch.clientX, touch.clientY);
            }
            
            function handleEnd(e) {
                if (!active) return;
                e.preventDefault();
                
                active = false;
                joystickContainer.classList.remove('active');
                joystickStick.style.transform = 'translate(-50%, -50%)';
            }
            
            joystickContainer.addEventListener('touchstart', handleStart);
            joystickContainer.addEventListener('touchmove', handleMove);
            joystickContainer.addEventListener('touchend', handleEnd);
            
            // Desktop testing
            joystickContainer.addEventListener('mousedown', handleStart);
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd);
            
            // Show hint
            const hint = document.createElement('div');
            hint.className = 'mobile-hint';
            hint.textContent = '조이스틱으로 이동';
            hint.style.display = 'block';
            document.body.appendChild(hint);
            setTimeout(() => hint.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
