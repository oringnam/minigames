<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, user-scalable=no">
    <title>스네이크 게임</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2em;
        }
        
        .score, .high-score {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        .score span, .high-score span {
            font-weight: bold;
            color: #1e3c72;
        }
        
        canvas {
            border: 3px solid #1e3c72;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            background: #f8f8f8;
        }
        
        .controls {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
        
        .back-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: #2a5298;
        }
        
        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 60, 114, 0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .game-over h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .game-over button {
            padding: 15px 40px;
            background: white;
            color: #1e3c72;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .game-over button:hover {
            background: #f0f0f0;
        }
        
        /* Mobile message */
        .mobile-hint {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            z-index: 999;
            display: none;
        }
    </style>
    <script src="../../mobile-controls.js"></script>
</head>
<body>
    <div class="container">
        <h1>🐍 스네이크</h1>
        <div class="game-info">
            <div class="score">점수: <span id="score">0</span></div>
            <div class="high-score">최고점수: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            화살표 키 또는 WASD로 이동 | 스페이스바로 일시정지
        </div>
        <a href="../../index.html" class="back-btn">← 메인으로</a>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>게임 오버!</h2>
        <p>점수: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">다시 시작</button>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 모바일 화면 크기 조정
        if (window.innerWidth < 768) {
            const size = Math.min(window.innerWidth - 60, 350);
            canvas.width = size;
            canvas.height = size;
        }
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{x: 10, y: 10}];
        let velocityX = 0;
        let velocityY = 0;
        let foodX = 15;
        let foodY = 15;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let paused = false;
        
        document.getElementById('highScore').textContent = highScore;
        
        function drawGame() {
            if (paused) return;
            
            // 이동 (시작 전에는 이동하지 않음)
            if (velocityX !== 0 || velocityY !== 0) {
                const head = {x: snake[0].x + velocityX, y: snake[0].y + velocityY};
                
                // 벽 충돌 체크
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    gameOver();
                    return;
                }
                
                // 자기 자신 충돌 체크
                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        gameOver();
                        return;
                    }
                }
                
                snake.unshift(head);
                
                // 먹이 먹기
                if (head.x === foodX && head.y === foodY) {
                    score++;
                    document.getElementById('score').textContent = score;
                    generateFood();
                    
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('snakeHighScore', highScore);
                        document.getElementById('highScore').textContent = highScore;
                    }
                } else {
                    snake.pop();
                }
            }
            
            // 화면 그리기
            ctx.fillStyle = '#f8f8f8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 뱀 그리기
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#1e3c72' : '#2a5298';
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
                
                if (index === 0) {
                    // 눈 그리기
                    ctx.fillStyle = 'white';
                    const eyeOffset = 4;
                    const eyeSize = 3;
                    if (velocityX !== 0 || velocityY === 0) {
                        ctx.fillRect(segment.x * gridSize + eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset - eyeSize, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                    }
                }
            });
            
            // 먹이 그리기
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(foodX * gridSize + gridSize/2, foodY * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function generateFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);
            
            // 뱀과 겹치지 않게
            for (let segment of snake) {
                if (segment.x === foodX && segment.y === foodY) {
                    generateFood();
                    return;
                }
            }
        }
        
        function gameOver() {
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function restartGame() {
            snake = [{x: 10, y: 10}];
            velocityX = 0;
            velocityY = 0;
            score = 0;
            paused = false;
            document.getElementById('score').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
            generateFood();
            gameLoop = setInterval(drawGame, 100);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                paused = !paused;
                return;
            }
            
            // 반대 방향으로는 못 감
            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && velocityY !== 1) {
                velocityX = 0;
                velocityY = -1;
            } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && velocityY !== -1) {
                velocityX = 0;
                velocityY = 1;
            } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && velocityX !== 1) {
                velocityX = -1;
                velocityY = 0;
            } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && velocityX !== -1) {
                velocityX = 1;
                velocityY = 0;
            }
        });
        
        // 게임 시작
        generateFood();
        gameLoop = setInterval(drawGame, 100);
        
        // Mobile controls
        if (isMobile()) {
            const joystick = new VirtualJoystick(null, {
                position: 'bottom-left',
                onChange: (direction) => {
                    const threshold = 0.5;
                    
                    if (Math.abs(direction.x) > Math.abs(direction.y)) {
                        if (direction.x > threshold && velocityX !== -1) {
                            velocityX = 1;
                            velocityY = 0;
                        } else if (direction.x < -threshold && velocityX !== 1) {
                            velocityX = -1;
                            velocityY = 0;
                        }
                    } else {
                        if (direction.y > threshold && velocityY !== -1) {
                            velocityX = 0;
                            velocityY = 1;
                        } else if (direction.y < -threshold && velocityY !== 1) {
                            velocityX = 0;
                            velocityY = -1;
                        }
                    }
                }
            });
            
            // Show mobile hint
            const hint = document.createElement('div');
            hint.className = 'mobile-hint';
            hint.textContent = '조이스틱으로 이동';
            hint.style.display = 'block';
            document.body.appendChild(hint);
            setTimeout(() => hint.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
