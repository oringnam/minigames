<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, user-scalable=no">
    <title>스네이크 게임</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }
        
        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: 900;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .score, .high-score {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 25px;
            border-radius: 15px;
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            flex: 1;
        }
        
        .score span, .high-score span {
            font-weight: bold;
            font-size: 1.5em;
            display: block;
            margin-top: 5px;
        }
        
        canvas {
            border: none;
            border-radius: 20px;
            display: block;
            margin: 0 auto;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.15),
                inset 0 1px 0 rgba(255,255,255,0.8);
        }
        
        .controls {
            margin-top: 20px;
            font-size: 0.85em;
            color: #999;
            background: #f8f8f8;
            padding: 12px 20px;
            border-radius: 12px;
            display: inline-block;
        }
        
        .back-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            animation: fadeIn 0.3s;
        }
        
        .game-over-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            min-width: 320px;
            max-width: 90vw;
        }
        
        .game-over h2 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .game-over p {
            font-size: 1.3em;
            margin: 15px 0;
            opacity: 0.9;
        }
        
        .game-over button {
            padding: 15px 40px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            display: inline-block;
        }
        
        .game-over button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        
        .game-over .share-btn {
            background: #FFD700;
            color: #333;
        }
        
        .game-over .share-btn:hover {
            background: #FFC700;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Mobile message */
        .mobile-hint {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            z-index: 999;
            display: none;
        }
        
        /* 파티클 */
        .particle {
            position: absolute;
            pointer-events: none;
        }
    </style>
    <script src="../../mobile-controls.js"></script>
    <script src="../../game-sounds.js"></script>
</head>
<body>
    <div class="container">
        <h1>🐍 스네이크</h1>
        <div class="game-info">
            <div class="score">점수: <span id="score">0</span></div>
            <div class="high-score">최고점수: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            화살표 키 또는 WASD로 이동 | 스페이스바로 일시정지
        </div>
        <a href="../../index.html" class="back-btn">← 메인으로</a>
    </div>
    
    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2>🎮</h2>
            <h2 style="white-space: nowrap;">게임 오버!</h2>
            <p>최종 점수</p>
            <p style="font-size: 2.5em; font-weight: bold; margin: 10px 0;"><span id="finalScore">0</span></p>
            <div style="margin-top: 20px;">
                <button onclick="shareScore()" class="share-btn">📋 공유하기</button>
                <button onclick="restartGame()">🔄 다시 시작</button>
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 모바일 세로 화면 최적화
        if (window.innerWidth < 768) {
            const maxSize = Math.min(window.innerWidth - 40, 380);
            canvas.width = maxSize;
            canvas.height = maxSize;
        }
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        // 사운드 & 이펙트
        const sounds = new GameSounds();
        const particles = new ParticleEffect(canvas, ctx);
        
        let snake = [{x: 10, y: 10, renderX: 10, renderY: 10}];
        let velocityX = 0;
        let velocityY = 0;
        let foodX = 15;
        let foodY = 15;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let animationLoop;
        let paused = false;
        let moveProgress = 0;
        let lastMoveTime = 0;
        let MOVE_INTERVAL = 150; // 이동 간격 (ms)
        let isGameOver = false; // 게임오버 플래그
        
        document.getElementById('highScore').textContent = highScore;
        
        function updateGame(currentTime) {
            if (paused || isGameOver) return;
            
            // 이동 로직 (일정 간격마다)
            if (currentTime - lastMoveTime >= MOVE_INTERVAL && (velocityX !== 0 || velocityY !== 0)) {
                const head = {
                    x: snake[0].x + velocityX, 
                    y: snake[0].y + velocityY,
                    renderX: snake[0].x + velocityX,
                    renderY: snake[0].y + velocityY
                };
                
                // 벽 충돌 체크
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    if (!isGameOver) gameOver();
                    return;
                }
                
                // 자기 자신 충돌 체크
                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        if (!isGameOver) gameOver();
                        return;
                    }
                }
                
                snake.unshift(head);
                
                // 먹이 먹기
                if (head.x === foodX && head.y === foodY) {
                    score++;
                    document.getElementById('score').textContent = score;
                    
                    sounds.coin();
                    vibrate(30);
                    particles.emit(
                        foodX * gridSize + gridSize/2,
                        foodY * gridSize + gridSize/2,
                        { count: 15, color: '#FFD700', speed: 4 }
                    );
                    
                    generateFood();
                    
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('snakeHighScore', highScore);
                        document.getElementById('highScore').textContent = highScore;
                        sounds.powerup();
                    }
                } else {
                    snake.pop();
                }
                
                lastMoveTime = currentTime;
                moveProgress = 0;
            }
            
            // 진행도 계산 (부드러운 애니메이션용)
            if (velocityX !== 0 || velocityY !== 0) {
                moveProgress = Math.min(1, (currentTime - lastMoveTime) / MOVE_INTERVAL);
            }
        }
        
        function animate(currentTime) {
            updateGame(currentTime);
            draw();
            animationLoop = requestAnimationFrame(animate);
        }
        
        function draw() {
            // 배경
            ctx.fillStyle = '#f8f8f8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 파티클
            particles.update();
            
            // 뱀 그리기 (부드러운 보간)
            snake.forEach((segment, index) => {
                let renderX = segment.x;
                let renderY = segment.y;
                
                // 머리만 부드럽게 애니메이션
                if (index === 0 && moveProgress < 1) {
                    const prevX = segment.x - velocityX;
                    const prevY = segment.y - velocityY;
                    renderX = prevX + (segment.x - prevX) * moveProgress;
                    renderY = prevY + (segment.y - prevY) * moveProgress;
                }
                
                const x = renderX * gridSize;
                const y = renderY * gridSize;
                
                // 몸통 그라디언트
                const gradient = ctx.createLinearGradient(x, y, x + gridSize, y + gridSize);
                if (index === 0) {
                    gradient.addColorStop(0, '#667eea');
                    gradient.addColorStop(1, '#764ba2');
                } else {
                    gradient.addColorStop(0, '#3498db');
                    gradient.addColorStop(1, '#2980b9');
                }
                
                ctx.fillStyle = gradient;
                ctx.fillRect(x + 1, y + 1, gridSize - 3, gridSize - 3);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, gridSize - 5, gridSize - 5);
                
                // 머리 눈
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeOffset = 5;
                    const eyeSize = 4;
                    
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    ctx.arc(x + gridSize - eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset, y + eyeOffset, eyeSize/2, 0, Math.PI * 2);
                    ctx.arc(x + gridSize - eyeOffset, y + eyeOffset, eyeSize/2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            // 먹이 (애니메이션)
            const pulse = Math.sin(Date.now() / 200) * 2;
            ctx.fillStyle = '#e74c3c';
            ctx.shadowBlur = 10 + pulse;
            ctx.shadowColor = '#e74c3c';
            ctx.beginPath();
            ctx.arc(
                foodX * gridSize + gridSize/2, 
                foodY * gridSize + gridSize/2, 
                gridSize/2 - 2 + pulse, 
                0, Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function generateFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);
            
            // 뱀과 겹치지 않게
            for (let segment of snake) {
                if (segment.x === foodX && segment.y === foodY) {
                    generateFood();
                    return;
                }
            }
        }
        
        function gameOver() {
            if (isGameOver) return; // 이미 게임오버 상태면 중복 실행 방지
            isGameOver = true;
            
            if (animationLoop) cancelAnimationFrame(animationLoop);
            sounds.gameover();
            vibrate([100, 50, 100]);
            shakeScreen(canvas, 8, 300);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function shareScore() {
            const text = `🐍 스네이크 게임\n\n🎯 점수: ${score}점\n🏆 최고점수: ${highScore}점\n\n🎮 미니게임 아케이드\nhttps://oringnam.github.io/minigames/`;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('📋 클립보드에 복사되었습니다!\n카톡에 붙여넣기 하세요!');
                    vibrate(50);
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }
        
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                alert('📋 클립보드에 복사되었습니다!\n카톡에 붙여넣기 하세요!');
                vibrate(50);
            } catch (err) {
                alert('복사 실패. 수동으로 복사해주세요:\n\n' + text);
            }
            document.body.removeChild(textarea);
        }
        
        function restartGame() {
            snake = [{x: 10, y: 10, renderX: 10, renderY: 10}];
            velocityX = 0;
            velocityY = 0;
            score = 0;
            paused = false;
            moveProgress = 0;
            lastMoveTime = 0;
            isGameOver = false; // 게임오버 플래그 리셋
            document.getElementById('score').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
            generateFood();
            
            if (animationLoop) cancelAnimationFrame(animationLoop);
            animationLoop = requestAnimationFrame(animate);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                paused = !paused;
                return;
            }
            
            // 반대 방향으로는 못 감
            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && velocityY !== 1) {
                velocityX = 0;
                velocityY = -1;
            } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && velocityY !== -1) {
                velocityX = 0;
                velocityY = 1;
            } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && velocityX !== 1) {
                velocityX = -1;
                velocityY = 0;
            } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && velocityX !== -1) {
                velocityX = 1;
                velocityY = 0;
            }
        });
        
        // 게임 시작
        generateFood();
        animationLoop = requestAnimationFrame(animate);
        
        // Mobile controls
        if (isMobile()) {
            let lastDirection = { x: 0, y: 0 };
            
            const joystick = new VirtualJoystick(null, {
                position: 'bottom-left',
                radius: 75,
                innerRadius: 38,
                onChange: (direction) => {
                    const threshold = 0.4;
                    const magnitude = Math.sqrt(direction.x * direction.x + direction.y * direction.y);
                    
                    if (magnitude < threshold) return;
                    
                    // 주 방향 결정 (더 명확한 방향 감지)
                    const absX = Math.abs(direction.x);
                    const absY = Math.abs(direction.y);
                    
                    if (absX > absY * 1.2) {
                        // 가로 우선
                        if (direction.x > 0 && velocityX !== -1) {
                            velocityX = 1;
                            velocityY = 0;
                        } else if (direction.x < 0 && velocityX !== 1) {
                            velocityX = -1;
                            velocityY = 0;
                        }
                    } else if (absY > absX * 1.2) {
                        // 세로 우선
                        if (direction.y > 0 && velocityY !== -1) {
                            velocityX = 0;
                            velocityY = 1;
                        } else if (direction.y < 0 && velocityY !== 1) {
                            velocityX = 0;
                            velocityY = -1;
                        }
                    }
                }
            });
            
            // Show mobile hint
            const hint = document.createElement('div');
            hint.className = 'mobile-hint';
            hint.textContent = '조이스틱으로 이동';
            hint.style.display = 'block';
            document.body.appendChild(hint);
            setTimeout(() => hint.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
