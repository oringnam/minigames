<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미로 탈출</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #3494E6 0%, #EC6EAD 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #3494E6;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
        }
        
        .info-box {
            background: #f0f0f0;
            padding: 15px 25px;
            border-radius: 10px;
        }
        
        .info-box h3 {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-box p {
            font-size: 1.5em;
            font-weight: bold;
            color: #3494E6;
        }
        
        canvas {
            border: 3px solid #3494E6;
            border-radius: 10px;
            background: white;
        }
        
        .controls {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 30px;
            background: #3494E6;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #EC6EAD;
        }
        
        .win-message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(52, 148, 230, 0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .win-message h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌀 미로 탈출</h1>
        
        <div class="game-info">
            <div class="info-box">
                <h3>시간</h3>
                <p id="time">0:00</p>
            </div>
            <div class="info-box">
                <h3>이동</h3>
                <p id="moves">0</p>
            </div>
        </div>
        
        <canvas id="mazeCanvas" width="600" height="600"></canvas>
        
        <div class="controls">
            화살표 키 또는 WASD로 이동 | 초록색 출구를 찾으세요!
        </div>
        
        <div class="btn-group">
            <button class="btn" onclick="generateNewMaze()">새 미로</button>
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <div class="win-message" id="winMessage">
        <h2>🎉 탈출 성공!</h2>
        <p id="winText">완료!</p>
        <button class="btn" onclick="generateNewMaze()" style="margin-top: 20px;">다시 시작</button>
    </div>
    
    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        
        const MAZE_SIZE = 21; // 홀수여야 함
        const CELL_SIZE = canvas.width / MAZE_SIZE;
        
        let maze = [];
        let player = {x: 1, y: 1};
        let exit = {x: MAZE_SIZE - 2, y: MAZE_SIZE - 2};
        let moves = 0;
        let startTime = null;
        let timerInterval = null;
        
        function generateMaze() {
            // 모든 셀을 벽으로 초기화
            maze = Array(MAZE_SIZE).fill().map(() => Array(MAZE_SIZE).fill(1));
            
            // 재귀적 백트래킹으로 미로 생성
            function carve(x, y) {
                maze[y][x] = 0;
                
                const directions = [
                    {dx: 2, dy: 0},
                    {dx: -2, dy: 0},
                    {dx: 0, dy: 2},
                    {dx: 0, dy: -2}
                ].sort(() => Math.random() - 0.5);
                
                for (let {dx, dy} of directions) {
                    const nx = x + dx;
                    const ny = y + dy;
                    
                    if (nx > 0 && nx < MAZE_SIZE - 1 && ny > 0 && ny < MAZE_SIZE - 1 && maze[ny][nx] === 1) {
                        maze[y + dy/2][x + dx/2] = 0;
                        carve(nx, ny);
                    }
                }
            }
            
            carve(1, 1);
            
            // 출구 확보
            maze[exit.y][exit.x] = 0;
        }
        
        function drawMaze() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let y = 0; y < MAZE_SIZE; y++) {
                for (let x = 0; x < MAZE_SIZE; x++) {
                    if (maze[y][x] === 1) {
                        // 벽
                        ctx.fillStyle = '#2c3e50';
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    } else {
                        // 길
                        ctx.fillStyle = '#ecf0f1';
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                    
                    // 그리드 라인
                    ctx.strokeStyle = '#bdc3c7';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            }
            
            // 출구
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(exit.x * CELL_SIZE + 5, exit.y * CELL_SIZE + 5, CELL_SIZE - 10, CELL_SIZE - 10);
            
            // 플레이어
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(
                player.x * CELL_SIZE + CELL_SIZE / 2,
                player.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 3,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // 플레이어 눈
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(
                player.x * CELL_SIZE + CELL_SIZE / 2 - 5,
                player.y * CELL_SIZE + CELL_SIZE / 2 - 3,
                3,
                0,
                Math.PI * 2
            );
            ctx.arc(
                player.x * CELL_SIZE + CELL_SIZE / 2 + 5,
                player.y * CELL_SIZE + CELL_SIZE / 2 - 3,
                3,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        function movePlayer(dx, dy) {
            const newX = player.x + dx;
            const newY = player.y + dy;
            
            if (newX >= 0 && newX < MAZE_SIZE && newY >= 0 && newY < MAZE_SIZE && maze[newY][newX] === 0) {
                player.x = newX;
                player.y = newY;
                moves++;
                document.getElementById('moves').textContent = moves;
                
                drawMaze();
                
                // 출구 도달 체크
                if (player.x === exit.x && player.y === exit.y) {
                    winGame();
                }
            }
        }
        
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('time').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function winGame() {
            clearInterval(timerInterval);
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            
            document.getElementById('winText').textContent = 
                `${moves}번 이동 | ${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('winMessage').style.display = 'block';
        }
        
        function generateNewMaze() {
            player = {x: 1, y: 1};
            moves = 0;
            startTime = Date.now();
            
            document.getElementById('moves').textContent = moves;
            document.getElementById('time').textContent = '0:00';
            document.getElementById('winMessage').style.display = 'none';
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            
            generateMaze();
            drawMaze();
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                movePlayer(0, -1);
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                e.preventDefault();
                movePlayer(0, 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                movePlayer(-1, 0);
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                e.preventDefault();
                movePlayer(1, 0);
            }
        });
        
        generateNewMaze();
    </script>
</body>
</html>
