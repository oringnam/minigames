<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엔드리스 러너</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #FF6B6B;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
        }
        
        .info-box {
            background: #f0f0f0;
            padding: 10px 25px;
            border-radius: 10px;
        }
        
        .info-box h3 {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-box p {
            font-size: 1.5em;
            font-weight: bold;
            color: #FF6B6B;
        }
        
        canvas {
            border: 3px solid #FF6B6B;
            border-radius: 10px;
            background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 75%, #8B4513 75%, #8B4513 100%);
            cursor: pointer;
        }
        
        .controls {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
        
        .back-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #FF6B6B;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: #4ECDC4;
        }
        
        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 107, 107, 0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .game-over h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .game-over button {
            padding: 15px 40px;
            background: white;
            color: #FF6B6B;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
    <script src="../../mobile-controls.js"></script>
</head>
<body>
    <div class="container">
        <h1>🏃 엔드리스 러너</h1>
        <div class="game-info">
            <div class="info-box">
                <h3>거리</h3>
                <p id="distance">0m</p>
            </div>
            <div class="info-box">
                <h3>최고기록</h3>
                <p id="highScore">0m</p>
            </div>
        </div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="controls">
            스페이스바, 클릭 또는 화살표 위로 점프
        </div>
        <a href="../../index.html" class="back-btn">← 메인으로</a>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>게임 오버!</h2>
        <p>달린 거리: <span id="finalDistance">0</span>m</p>
        <button onclick="startGame()">다시 시작</button>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        
        // 모바일 화면 크기 조정
        if (window.innerWidth < 768) {
            const maxWidth = Math.min(window.innerWidth - 60, 350);
            canvas.width = maxWidth;
            canvas.height = maxWidth * 1.2;
        }
        const ctx = canvas.getContext('2d');
        
        const player = {
            x: 50,
            y: 300,
            width: 40,
            height: 50,
            velocityY: 0,
            gravity: 0.8,
            jumpPower: -15,
            isJumping: false
        };
        
        let obstacles = [];
        let distance = 0;
        let highScore = localStorage.getItem('runnerHighScore') || 0;
        let gameSpeed = 4; // 속도 낮춤 (5 -> 4)
        let gameRunning = false;
        let frameCount = 0;
        
        document.getElementById('highScore').textContent = highScore + 'm';
        
        function drawPlayer() {
            // 몸통
            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // 머리
            ctx.fillStyle = '#FFE66D';
            ctx.beginPath();
            ctx.arc(player.x + player.width/2, player.y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // 눈
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(player.x + player.width/2 - 5, player.y - 12, 3, 0, Math.PI * 2);
            ctx.arc(player.x + player.width/2 + 5, player.y - 12, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // 팔 (달리는 애니메이션)
            const armSwing = Math.sin(frameCount * 0.2) * 10;
            ctx.strokeStyle = '#FF6B6B';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(player.x + 5, player.y + 15);
            ctx.lineTo(player.x - 5, player.y + 25 + armSwing);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(player.x + player.width - 5, player.y + 15);
            ctx.lineTo(player.x + player.width + 5, player.y + 25 - armSwing);
            ctx.stroke();
        }
        
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                // 선인장 형태
                ctx.fillStyle = '#2ECC71';
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                ctx.fillRect(obstacle.x - 10, obstacle.y + 10, 10, 20);
                ctx.fillRect(obstacle.x + obstacle.width, obstacle.y + 10, 10, 20);
                
                // 테두리
                ctx.strokeStyle = '#27AE60';
                ctx.lineWidth = 2;
                ctx.strokeRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            });
        }
        
        function drawGround() {
            const groundY = 350;
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            
            // 땅 무늬
            ctx.fillStyle = '#654321';
            for (let i = 0; i < canvas.width; i += 30) {
                const offset = (frameCount * gameSpeed) % 30;
                ctx.fillRect(i - offset, groundY, 15, 10);
            }
        }
        
        function drawBackground() {
            // 하늘
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, 350);
            
            // 구름
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            const cloudOffset = (frameCount * (gameSpeed * 0.3)) % (canvas.width + 100);
            
            ctx.beginPath();
            ctx.arc(100 - cloudOffset, 80, 25, 0, Math.PI * 2);
            ctx.arc(125 - cloudOffset, 75, 30, 0, Math.PI * 2);
            ctx.arc(150 - cloudOffset, 80, 25, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(400 - cloudOffset, 120, 20, 0, Math.PI * 2);
            ctx.arc(420 - cloudOffset, 118, 25, 0, Math.PI * 2);
            ctx.arc(440 - cloudOffset, 120, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // 태양
            ctx.fillStyle = '#FFE66D';
            ctx.beginPath();
            ctx.arc(550, 50, 30, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function update() {
            if (!gameRunning) return;
            
            frameCount++;
            
            // 플레이어 물리
            player.velocityY += player.gravity;
            player.y += player.velocityY;
            
            const groundLevel = 300;
            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.velocityY = 0;
                player.isJumping = false;
            }
            
            // 장애물 생성
            if (frameCount % 90 === 0) {
                obstacles.push({
                    x: canvas.width,
                    y: groundLevel - 40,
                    width: 30,
                    height: 40
                });
            }
            
            // 장애물 이동 및 충돌
            obstacles.forEach((obstacle, index) => {
                obstacle.x -= gameSpeed;
                
                // 충돌 검사
                if (player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y) {
                    endGame();
                }
                
                // 통과한 장애물 제거 및 점수
                if (obstacle.x + obstacle.width < 0) {
                    obstacles.splice(index, 1);
                    distance += 10;
                    document.getElementById('distance').textContent = distance + 'm';
                    
                    // 속도 증가 (천천히)
                    if (distance % 100 === 0 && gameSpeed < 10) {
                        gameSpeed += 0.3; // 증가량 낮춤 (0.5 -> 0.3)
                    }
                    
                    if (distance > highScore) {
                        highScore = distance;
                        localStorage.setItem('runnerHighScore', highScore);
                        document.getElementById('highScore').textContent = highScore + 'm';
                    }
                }
            });
            
            draw();
            requestAnimationFrame(update);
        }
        
        function draw() {
            drawBackground();
            drawGround();
            drawObstacles();
            drawPlayer();
        }
        
        function jump() {
            if (!player.isJumping && gameRunning) {
                player.velocityY = player.jumpPower;
                player.isJumping = true;
            }
        }
        
        function startGame() {
            player.y = 300;
            player.velocityY = 0;
            player.isJumping = false;
            obstacles = [];
            distance = 0;
            gameSpeed = 5;
            frameCount = 0;
            gameRunning = true;
            
            document.getElementById('distance').textContent = distance + 'm';
            document.getElementById('gameOver').style.display = 'none';
            
            update();
        }
        
        function endGame() {
            gameRunning = false;
            document.getElementById('finalDistance').textContent = distance;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        canvas.addEventListener('click', jump);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!gameRunning) {
                    startGame();
                } else {
                    jump();
                }
            }
        });
        
        // 초기 화면
        draw();
        
        // Mobile controls
        if (isMobile()) {
            new VirtualButton({
                label: '⬆️',
                position: 'bottom-center',
                size: 80,
                color: 'rgba(255, 107, 107, 0.7)',
                onPress: () => {
                    jump();
                }
            });
        }
    </script>
</body>
</html>
