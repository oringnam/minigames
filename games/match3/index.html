<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매치 3</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <script src="../../game-sounds.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #f5576c;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
        }
        
        .info-box {
            background: #f0f0f0;
            padding: 15px 30px;
            border-radius: 10px;
        }
        
        .info-box h3 {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-box p {
            font-size: 1.8em;
            font-weight: bold;
            color: #f5576c;
        }
        
        .board {
            display: inline-grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            gap: 5px;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .gem {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .gem:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .gem.selected {
            transform: scale(1.15);
            box-shadow: 0 0 0 4px #f5576c;
        }
        
        .gem.matched {
            animation: pop 0.3s ease-out;
        }
        
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); }
            100% { transform: scale(0); opacity: 0; }
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 30px;
            background: #f5576c;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #f093fb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎 매치 3</h1>
        
        <div class="game-info">
            <div class="info-box">
                <h3>점수</h3>
                <p id="score">0</p>
            </div>
            <div class="info-box">
                <h3>이동</h3>
                <p id="moves">30</p>
            </div>
            <div class="info-box">
                <h3>목표</h3>
                <p id="target">1000</p>
            </div>
        </div>
        
        <div class="board" id="board"></div>
        
        <div class="btn-group">
            <button class="btn" onclick="initGame()">새 게임</button>
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <script>
        const BOARD_SIZE = 8;
        const GEMS = ['🔴', '🟢', '🔵', '🟡', '🟣', '🟠'];
        
        // 사운드
        const sounds = new GameSounds();
        
        let board = [];
        let selectedGem = null;
        let score = 0;
        let moves = 30;
        let target = 1000;
        
        function createBoard() {
            board = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    board[r][c] = GEMS[Math.floor(Math.random() * GEMS.length)];
                }
            }
            // 초기 매치 제거
            removeInitialMatches();
        }
        
        function removeInitialMatches() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    while (isMatch(r, c)) {
                        board[r][c] = GEMS[Math.floor(Math.random() * GEMS.length)];
                    }
                }
            }
        }
        
        function isMatch(row, col) {
            const gem = board[row][col];
            
            // 가로 체크
            if (col >= 2 && board[row][col-1] === gem && board[row][col-2] === gem) {
                return true;
            }
            
            // 세로 체크
            if (row >= 2 && board[row-1][col] === gem && board[row-2][col] === gem) {
                return true;
            }
            
            return false;
        }
        
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const gemDiv = document.createElement('div');
                    gemDiv.className = 'gem';
                    gemDiv.textContent = board[r][c];
                    gemDiv.dataset.row = r;
                    gemDiv.dataset.col = c;
                    gemDiv.addEventListener('click', () => selectGem(r, c));
                    boardElement.appendChild(gemDiv);
                }
            }
        }
        
        function selectGem(row, col) {
            if (moves <= 0) return;
            
            if (selectedGem === null) {
                selectedGem = {row, col};
                highlightGem(row, col);
                
                // 🎵 선택 사운드
                sounds.play('click');
                vibrate(10);
            } else {
                const {row: r1, col: c1} = selectedGem;
                
                // 인접한 보석인지 확인
                if (Math.abs(r1 - row) + Math.abs(c1 - col) === 1) {
                    swapGems(r1, c1, row, col);
                    
                    if (findMatches().length > 0) {
                        moves--;
                        document.getElementById('moves').textContent = moves;
                        processMatches();
                        
                        if (moves === 0) {
                            setTimeout(checkGameEnd, 500);
                        }
                    } else {
                        // 🎵 매치 없으면 되돌리기
                        sounds.play('error');
                        vibrate(100);
                        swapGems(r1, c1, row, col);
                    }
                }
                
                clearSelection();
            }
        }
        
        function swapGems(r1, c1, r2, c2) {
            [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
            renderBoard();
        }
        
        function highlightGem(row, col) {
            const gems = document.querySelectorAll('.gem');
            gems.forEach(gem => {
                if (parseInt(gem.dataset.row) === row && parseInt(gem.dataset.col) === col) {
                    gem.classList.add('selected');
                }
            });
        }
        
        function clearSelection() {
            selectedGem = null;
            document.querySelectorAll('.gem').forEach(gem => {
                gem.classList.remove('selected');
            });
        }
        
        function findMatches() {
            const matches = [];
            
            // 가로 매치
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE - 2; c++) {
                    if (board[r][c] && board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                        matches.push({r, c});
                        matches.push({r, c: c+1});
                        matches.push({r, c: c+2});
                    }
                }
            }
            
            // 세로 매치
            for (let c = 0; c < BOARD_SIZE; c++) {
                for (let r = 0; r < BOARD_SIZE - 2; r++) {
                    if (board[r][c] && board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
                        matches.push({r, c});
                        matches.push({r: r+1, c});
                        matches.push({r: r+2, c});
                    }
                }
            }
            
            // 중복 제거
            return matches.filter((match, index, self) =>
                index === self.findIndex(m => m.r === match.r && m.c === match.c)
            );
        }
        
        function processMatches() {
            const matches = findMatches();
            
            if (matches.length > 0) {
                const points = matches.length * 10;
                score += points;
                document.getElementById('score').textContent = score;
                
                // 🎵 사운드 & 진동 (큰 매치는 파워업 사운드)
                if (matches.length >= 5) {
                    sounds.play('powerup');
                    vibrate([50, 30, 50]);
                } else {
                    sounds.play('match');
                    vibrate(30);
                }
                
                // 매치된 보석 표시
                matches.forEach(({r, c}) => {
                    const gems = document.querySelectorAll('.gem');
                    gems.forEach(gem => {
                        if (parseInt(gem.dataset.row) === r && parseInt(gem.dataset.col) === c) {
                            gem.classList.add('matched');
                        }
                    });
                });
                
                setTimeout(() => {
                    // 매치된 보석 제거
                    matches.forEach(({r, c}) => {
                        board[r][c] = null;
                    });
                    
                    dropGems();
                    fillEmpty();
                    renderBoard();
                    
                    // 연쇄 매치 체크
                    if (findMatches().length > 0) {
                        setTimeout(() => processMatches(), 300);
                    }
                }, 300);
            }
        }
        
        function dropGems() {
            for (let c = 0; c < BOARD_SIZE; c++) {
                let emptyRow = BOARD_SIZE - 1;
                for (let r = BOARD_SIZE - 1; r >= 0; r--) {
                    if (board[r][c] !== null) {
                        if (r !== emptyRow) {
                            board[emptyRow][c] = board[r][c];
                            board[r][c] = null;
                        }
                        emptyRow--;
                    }
                }
            }
        }
        
        function fillEmpty() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === null) {
                        board[r][c] = GEMS[Math.floor(Math.random() * GEMS.length)];
                    }
                }
            }
        }
        
        function checkGameEnd() {
            const won = score >= target;
            
            // 🎵 승리/패배 사운드 + 진동
            if (won) {
                sounds.play('victory');
                vibrate([100, 50, 100, 50, 200]);
            } else {
                sounds.play('gameover');
                vibrate(200);
            }
            
            const message = won 
                ? `🎉 축하합니다! 목표 달성!\n\n점수: ${score}\n이동: ${30 - moves}번 사용`
                : `게임 오버!\n\n점수: ${score} / 목표: ${target}`;
            
            setTimeout(() => {
                if (confirm(message + '\n\n📋 점수를 복사하시겠습니까?')) {
                    shareScore(won);
                }
            }, 500);
        }
        
        function shareScore(won) {
            const emoji = won ? '🎉' : '💎';
            const status = won ? '목표 달성!' : '도전!';
            const text = `${emoji} 매치3 게임 ${status}\n\n🎯 점수: ${score}점\n🎲 목표: ${target}점\n\n🎮 미니게임 아케이드\nhttps://oringnam.github.io/minigames/`;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('📋 클립보드에 복사되었습니다!');
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }
        
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                alert('📋 클립보드에 복사되었습니다!');
            } catch (err) {
                alert('복사 실패:\n\n' + text);
            }
            document.body.removeChild(textarea);
        }
        
        function initGame() {
            score = 0;
            moves = 30;
            selectedGem = null;
            
            document.getElementById('score').textContent = score;
            document.getElementById('moves').textContent = moves;
            
            // 🎵 게임 시작 사운드
            sounds.play('click');
            
            createBoard();
            renderBoard();
        }
        
        initGame();
    </script>
</body>
</html>
