<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매치 3</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <script src="../../game-sounds.js"></script>
    <script src="../../game-utils.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 20px 20px 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
            text-align: center;
        }
        
        h1 {
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: 900;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
        }
        
        .info-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 15px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
        
        .info-box h3 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .info-box p {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .board {
            display: inline-grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            gap: 5px;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .gem {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .gem:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .gem.selected {
            transform: scale(1.15);
            box-shadow: 0 0 0 4px #f5576c;
        }
        
        .gem.matched {
            animation: pop 0.3s ease-out;
        }
        
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎 매치 3</h1>
        
        <div id="scoreBoard"></div>
        
        <div class="board" id="board"></div>
        
        <div class="btn-group">
            <button class="btn" onclick="initGame()">새 게임</button>
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <script>
        const BOARD_SIZE = 8;
        const GEMS = ['🔴', '🟢', '🔵', '🟡', '🟣', '🟠'];
        
        // 사운드
        const sounds = new GameSounds();
        
        let board = [];
        let selectedGem = null;
        let score = 0;
        let moves = 30;
        let target = 1000;
        let chain = 0; // 연쇄 카운터
        
        // 점수판 생성 (GameUI)
        const scoreBoard = GameUI.createScoreBoard({
            items: [
                { id: 'score', label: '점수', value: 0 },
                { id: 'moves', label: '이동', value: 30 },
                { id: 'target', label: '목표', value: 1000 }
            ],
            containerId: 'scoreBoard'
        });
        
        function createBoard() {
            board = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    board[r][c] = GameUtils.randomElement(GEMS);
                }
            }
            // 초기 매치 제거
            removeInitialMatches();
        }
        
        function removeInitialMatches() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    while (isMatch(r, c)) {
                        board[r][c] = GameUtils.randomElement(GEMS);
                    }
                }
            }
        }
        
        function isMatch(row, col) {
            const gem = board[row][col];
            
            // 가로 체크
            if (col >= 2 && board[row][col-1] === gem && board[row][col-2] === gem) {
                return true;
            }
            
            // 세로 체크
            if (row >= 2 && board[row-1][col] === gem && board[row-2][col] === gem) {
                return true;
            }
            
            return false;
        }
        
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const gemDiv = document.createElement('div');
                    gemDiv.className = 'gem';
                    gemDiv.textContent = board[r][c];
                    gemDiv.dataset.row = r;
                    gemDiv.dataset.col = c;
                    gemDiv.addEventListener('click', () => selectGem(r, c));
                    boardElement.appendChild(gemDiv);
                }
            }
        }
        
        function selectGem(row, col) {
            if (moves <= 0) return;
            
            if (selectedGem === null) {
                selectedGem = {row, col};
                highlightGem(row, col);
                
                // 🎵 선택 사운드
                sounds.play('click');
                vibrate(10);
            } else {
                const {row: r1, col: c1} = selectedGem;
                
                // 인접한 보석인지 확인
                if (Math.abs(r1 - row) + Math.abs(c1 - col) === 1) {
                    swapGems(r1, c1, row, col);
                    
                    if (findMatches().length > 0) {
                        chain = 0; // 연쇄 카운터 리셋 (새 이동)
                        moves--;
                        scoreBoard.update('moves', moves);
                        processMatches();
                        
                        if (moves === 0) {
                            setTimeout(checkGameEnd, 500);
                        }
                    } else {
                        // 🎵 매치 없으면 되돌리기
                        sounds.play('error');
                        vibrate(100);
                        swapGems(r1, c1, row, col);
                    }
                }
                
                clearSelection();
            }
        }
        
        function swapGems(r1, c1, r2, c2) {
            [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
            renderBoard();
        }
        
        function highlightGem(row, col) {
            const gems = document.querySelectorAll('.gem');
            gems.forEach(gem => {
                if (parseInt(gem.dataset.row) === row && parseInt(gem.dataset.col) === col) {
                    gem.classList.add('selected');
                }
            });
        }
        
        function clearSelection() {
            selectedGem = null;
            document.querySelectorAll('.gem').forEach(gem => {
                gem.classList.remove('selected');
            });
        }
        
        function findMatches() {
            const matches = [];
            
            // 가로 매치
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE - 2; c++) {
                    if (board[r][c] && board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                        matches.push({r, c});
                        matches.push({r, c: c+1});
                        matches.push({r, c: c+2});
                    }
                }
            }
            
            // 세로 매치
            for (let c = 0; c < BOARD_SIZE; c++) {
                for (let r = 0; r < BOARD_SIZE - 2; r++) {
                    if (board[r][c] && board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
                        matches.push({r, c});
                        matches.push({r: r+1, c});
                        matches.push({r: r+2, c});
                    }
                }
            }
            
            // 중복 제거
            return matches.filter((match, index, self) =>
                index === self.findIndex(m => m.r === match.r && m.c === match.c)
            );
        }
        
        function processMatches() {
            const matches = findMatches();
            
            if (matches.length > 0) {
                chain++; // 연쇄 증가
                
                // 연쇄 보너스
                const basePoints = matches.length * 10;
                const chainBonus = chain > 1 ? (chain - 1) * 5 : 0;
                const points = basePoints + chainBonus;
                score += points;
                scoreBoard.update('score', score);
                
                // 🎵 사운드 & 진동 (큰 매치 또는 연쇄는 파워업 사운드)
                if (matches.length >= 5 || chain >= 3) {
                    sounds.play('powerup');
                    vibrate([50, 30, 50]);
                    console.log(`💎 ${chain}연쇄! +${points}점`);
                } else {
                    sounds.play('match');
                    vibrate(30);
                }
                
                // 매치된 보석 표시
                matches.forEach(({r, c}) => {
                    const gems = document.querySelectorAll('.gem');
                    gems.forEach(gem => {
                        if (parseInt(gem.dataset.row) === r && parseInt(gem.dataset.col) === c) {
                            gem.classList.add('matched');
                        }
                    });
                });
                
                setTimeout(() => {
                    // 매치된 보석 제거
                    matches.forEach(({r, c}) => {
                        board[r][c] = null;
                    });
                    
                    dropGems();
                    fillEmpty();
                    renderBoard();
                    
                    // 연쇄 매치 체크
                    if (findMatches().length > 0) {
                        setTimeout(() => processMatches(), 300);
                    }
                }, 300);
            }
        }
        
        function dropGems() {
            for (let c = 0; c < BOARD_SIZE; c++) {
                let emptyRow = BOARD_SIZE - 1;
                for (let r = BOARD_SIZE - 1; r >= 0; r--) {
                    if (board[r][c] !== null) {
                        if (r !== emptyRow) {
                            board[emptyRow][c] = board[r][c];
                            board[r][c] = null;
                        }
                        emptyRow--;
                    }
                }
            }
        }
        
        function fillEmpty() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === null) {
                        board[r][c] = GameUtils.randomElement(GEMS);
                    }
                }
            }
        }
        
        function checkGameEnd() {
            const won = score >= target;
            
            // 🎵 승리/패배 사운드 + 진동
            if (won) {
                sounds.play('victory');
                vibrate([100, 50, 100, 50, 200]);
            } else {
                sounds.play('gameover');
                vibrate(200);
            }
            
            // 모달 표시 (GameUtils)
            setTimeout(() => {
                GameUtils.createModal({
                    title: won ? '🎉 목표 달성!' : '💀 게임 오버!',
                    message: won ? '축하합니다!' : '다시 도전하세요!',
                    stats: [
                        { label: '최종 점수', value: score },
                        { label: '목표', value: target },
                        { label: '사용 이동', value: 30 - moves }
                    ],
                    buttons: [
                        {
                            text: '📱 카톡 공유',
                            action: () => {
                                const emoji = won ? '🎉' : '💎';
                                const status = won ? '목표 달성!' : '도전!';
                                const text = `${emoji} 매치3 ${status}\n\n점수: ${score}\n목표: ${target}\n\nhttps://oringnam.github.io/minigames/`;
                                GameUtils.copyToClipboard(text);
                            }
                        },
                        {
                            text: '다시 하기',
                            action: initGame
                        }
                    ]
                });
            }, 500);
        }
        
        function initGame() {
            score = 0;
            moves = 30;
            selectedGem = null;
            chain = 0;
            
            scoreBoard.update('score', 0);
            scoreBoard.update('moves', 30);
            
            // 플레이 추적
            GameUtils.trackPlay('match3');
            GameUtils.startTimer('match3');
            
            // 🎵 게임 시작 사운드
            sounds.play('click');
            
            createBoard();
            renderBoard();
        }
        
        // 게임 시작
        GameUtils.trackPlay('match3');
        GameUtils.startTimer('match3');
        initGame();
    </script>
</body>
</html>
