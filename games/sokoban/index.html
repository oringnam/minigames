<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소코반</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #2980b9;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
        }
        
        .info-box {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        .info-box h3 {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-box p {
            font-size: 1.5em;
            font-weight: bold;
            color: #2980b9;
        }
        
        canvas {
            border: 3px solid #2980b9;
            border-radius: 10px;
            background: #ecf0f1;
        }
        
        .controls {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 30px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #3498db;
        }
    </style>
    <script src="../../mobile-controls.js"></script>
    <script src="../../game-sounds.js"></script>
</head>
<body>
    <div class="container">
        <h1>📦 소코반</h1>
        
        <div class="game-info">
            <div class="info-box">
                <h3>레벨</h3>
                <p id="level">1</p>
            </div>
            <div class="info-box">
                <h3>이동</h3>
                <p id="moves">0</p>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="480" height="480"></canvas>
        
        <div class="controls">
            화살표 키 또는 WASD로 이동 | 모든 상자를 목표 지점에 밀어넣으세요!<br>
            Z = 되돌리기 | R = 재시작
        </div>
        
        <div class="btn-group">
            <button class="btn" onclick="resetLevel()">재시작</button>
            <button class="btn" onclick="nextLevel()">다음 레벨</button>
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        
        // 모바일 화면 크기 조정
        if (window.innerWidth < 768) {
            const maxWidth = Math.min(window.innerWidth - 60, 350);
            canvas.width = maxWidth;
            canvas.height = maxWidth * 1.2;
        }
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 60;
        const WALL = '#';
        const FLOOR = ' ';
        const BOX = '$';
        const TARGET = '.';
        const PLAYER = '@';
        const BOX_ON_TARGET = '*';
        const PLAYER_ON_TARGET = '+';
        
        let currentLevel = 0;
        let player = {x: 0, y: 0};
        let boxes = [];
        let targets = [];
        let walls = [];
        let moves = 0;
        let history = [];
        
        // 사운드
        const sounds = new GameSounds();
        
        const levels = [
            [
                "########",
                "#      #",
                "# $  . #",
                "#  @   #",
                "#  $  .#",
                "########"
            ],
            [
                "  ######  ",
                "###    ###",
                "#  $  $  #",
                "# . @ .  #",
                "#  $  $  #",
                "###   .. #",
                "  ########"
            ],
            [
                " ##### ",
                " #   # ",
                "## $ ##",
                "#  $  #",
                "# .@. #",
                "#  .  #",
                "#######"
            ]
        ];
        
        function loadLevel(levelIndex) {
            if (levelIndex >= levels.length) {
                alert('🎉 모든 레벨 클리어!');
                currentLevel = 0;
                levelIndex = 0;
            }
            
            currentLevel = levelIndex;
            const level = levels[levelIndex];
            boxes = [];
            targets = [];
            walls = [];
            moves = 0;
            history = [];
            
            document.getElementById('level').textContent = levelIndex + 1;
            document.getElementById('moves').textContent = moves;
            
            for (let y = 0; y < level.length; y++) {
                for (let x = 0; x < level[y].length; x++) {
                    const char = level[y][x];
                    
                    if (char === WALL) {
                        walls.push({x, y});
                    } else if (char === BOX) {
                        boxes.push({x, y});
                    } else if (char === TARGET) {
                        targets.push({x, y});
                    } else if (char === PLAYER) {
                        player = {x, y};
                    } else if (char === BOX_ON_TARGET) {
                        boxes.push({x, y});
                        targets.push({x, y});
                    } else if (char === PLAYER_ON_TARGET) {
                        player = {x, y};
                        targets.push({x, y});
                    }
                }
            }
            
            draw();
        }
        
        function draw() {
            ctx.fillStyle = '#ecf0f1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 벽
            ctx.fillStyle = '#34495e';
            walls.forEach(wall => {
                ctx.fillRect(wall.x * TILE_SIZE, wall.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = '#2c3e50';
                ctx.strokeRect(wall.x * TILE_SIZE, wall.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            });
            
            // 목표
            ctx.fillStyle = '#f39c12';
            targets.forEach(target => {
                ctx.beginPath();
                ctx.arc(
                    target.x * TILE_SIZE + TILE_SIZE/2,
                    target.y * TILE_SIZE + TILE_SIZE/2,
                    TILE_SIZE/4,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            });
            
            // 상자
            boxes.forEach(box => {
                const onTarget = targets.some(t => t.x === box.x && t.y === box.y);
                ctx.fillStyle = onTarget ? '#27ae60' : '#e67e22';
                ctx.fillRect(
                    box.x * TILE_SIZE + 10,
                    box.y * TILE_SIZE + 10,
                    TILE_SIZE - 20,
                    TILE_SIZE - 20
                );
                
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(
                    box.x * TILE_SIZE + 10,
                    box.y * TILE_SIZE + 10,
                    TILE_SIZE - 20,
                    (TILE_SIZE - 20) / 3
                );
            });
            
            // 플레이어
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.arc(
                player.x * TILE_SIZE + TILE_SIZE/2,
                player.y * TILE_SIZE + TILE_SIZE/2,
                TILE_SIZE/3,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // 플레이어 눈
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(
                player.x * TILE_SIZE + TILE_SIZE/2 - 8,
                player.y * TILE_SIZE + TILE_SIZE/2 - 5,
                4,
                0,
                Math.PI * 2
            );
            ctx.arc(
                player.x * TILE_SIZE + TILE_SIZE/2 + 8,
                player.y * TILE_SIZE + TILE_SIZE/2 - 5,
                4,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        function isWall(x, y) {
            return walls.some(w => w.x === x && w.y === y);
        }
        
        function getBox(x, y) {
            return boxes.find(b => b.x === x && b.y === y);
        }
        
        function saveState() {
            history.push({
                player: {...player},
                boxes: boxes.map(b => ({...b})),
                moves
            });
        }
        
        function move(dx, dy) {
            const newX = player.x + dx;
            const newY = player.y + dy;
            
            // 벽에 부딪힘
            if (isWall(newX, newY)) {
                sounds.play('error');
                vibrate(50);
                return;
            }
            
            const box = getBox(newX, newY);
            if (box) {
                const boxNewX = box.x + dx;
                const boxNewY = box.y + dy;
                
                // 상자를 밀 수 없음 (벽 or 다른 상자)
                if (isWall(boxNewX, boxNewY) || getBox(boxNewX, boxNewY)) {
                    sounds.play('error');
                    vibrate(50);
                    return;
                }
                
                saveState();
                box.x = boxNewX;
                box.y = boxNewY;
                
                // 🎵 상자를 밀었을 때
                const onTarget = targets.some(t => t.x === boxNewX && t.y === boxNewY);
                if (onTarget) {
                    sounds.play('success'); // 목표 지점에 놓음!
                    vibrate([30, 20, 30]);
                } else {
                    sounds.play('pop'); // 일반 상자 밀기
                    vibrate(20);
                }
            } else {
                saveState();
                // 🎵 일반 이동
                sounds.play('click');
                vibrate(10);
            }
            
            player.x = newX;
            player.y = newY;
            moves++;
            document.getElementById('moves').textContent = moves;
            
            draw();
            checkWin();
        }
        
        function checkWin() {
            const allBoxesOnTargets = boxes.every(box =>
                targets.some(t => t.x === box.x && t.y === box.y)
            );
            
            if (allBoxesOnTargets) {
                // 🎵 레벨 클리어!
                sounds.play('victory');
                vibrate([100, 50, 100, 50, 200]);
                
                setTimeout(() => {
                    alert(`🎉 레벨 클리어! ${moves}번 이동`);
                    nextLevel();
                }, 500);
            }
        }
        
        function undo() {
            if (history.length > 0) {
                const state = history.pop();
                player = state.player;
                boxes = state.boxes;
                moves = state.moves;
                document.getElementById('moves').textContent = moves;
                
                // 🎵 되돌리기 사운드
                sounds.play('pop');
                vibrate(20);
                
                draw();
            } else {
                // 되돌릴 게 없음
                sounds.play('error');
                vibrate(50);
            }
        }
        
        function resetLevel() {
            sounds.play('click');
            loadLevel(currentLevel);
        }
        
        function nextLevel() {
            sounds.play('click');
            loadLevel(currentLevel + 1);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                move(0, -1);
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                e.preventDefault();
                move(0, 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                move(-1, 0);
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                e.preventDefault();
                move(1, 0);
            } else if (e.key === 'z' || e.key === 'Z') {
                e.preventDefault();
                undo();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                resetLevel();
            }
        });
        
        loadLevel(0);
        
        // Mobile controls
        if (isMobile()) {
            let lastMove = 0;
            
            const joystick = new VirtualJoystick(null, {
                position: 'bottom-left',
                onChange: (direction) => {
                    const now = Date.now();
                    if (now - lastMove < 200) return; // Debounce
                    
                    const threshold = 0.7;
                    
                    if (Math.abs(direction.x) > Math.abs(direction.y)) {
                        if (direction.x > threshold) {
                            move(1, 0);
                            lastMove = now;
                        } else if (direction.x < -threshold) {
                            move(-1, 0);
                            lastMove = now;
                        }
                    } else {
                        if (direction.y > threshold) {
                            move(0, 1);
                            lastMove = now;
                        } else if (direction.y < -threshold) {
                            move(0, -1);
                            lastMove = now;
                        }
                    }
                }
            });
            
            // Undo button
            new VirtualButton({
                label: '↶',
                position: 'bottom-right',
                onPress: () => {
                    undo();
                }
            });
        }
    </script>
</body>
</html>
