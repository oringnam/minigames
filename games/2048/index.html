<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="../../mobile-layout.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #e17055;
            margin-bottom: 20px;
            font-size: 3em;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
        }
        
        .score-box {
            background: #e17055;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            min-width: 120px;
        }
        
        .score-box h3 {
            font-size: 0.9em;
            margin-bottom: 5px;
            opacity: 0.9;
        }
        
        .score-box p {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .board {
            background: #bbada0;
            border-radius: 10px;
            padding: 15px;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 15px;
        }
        
        .cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            transition: all 0.15s ease-in-out;
        }
        
        .cell.tile-2 { background: #eee4da; color: #776e65; }
        .cell.tile-4 { background: #ede0c8; color: #776e65; }
        .cell.tile-8 { background: #f2b179; color: #f9f6f2; }
        .cell.tile-16 { background: #f59563; color: #f9f6f2; }
        .cell.tile-32 { background: #f67c5f; color: #f9f6f2; }
        .cell.tile-64 { background: #f65e3b; color: #f9f6f2; }
        .cell.tile-128 { background: #edcf72; color: #f9f6f2; font-size: 1.8em; }
        .cell.tile-256 { background: #edcc61; color: #f9f6f2; font-size: 1.8em; }
        .cell.tile-512 { background: #edc850; color: #f9f6f2; font-size: 1.8em; }
        .cell.tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1.5em; }
        .cell.tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 1.5em; }
        
        .controls {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 30px;
            background: #e17055;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #d63031;
        }
        
        .game-over-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(238, 228, 218, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 10;
        }
        
        .game-over-overlay h2 {
            font-size: 2.5em;
            color: #776e65;
            margin-bottom: 20px;
        }
        
        .game-over-overlay p {
            font-size: 1.2em;
            color: #776e65;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔢 2048</h1>
        <div class="game-info">
            <div class="score-box">
                <h3>점수</h3>
                <p id="score">0</p>
            </div>
            <div class="score-box">
                <h3>최고점수</h3>
                <p id="bestScore">0</p>
            </div>
        </div>
        
        <div class="board">
            <div class="grid" id="grid"></div>
        </div>
        
        <div class="game-over-overlay" id="gameOver">
            <h2>게임 오버!</h2>
            <p>점수: <span id="finalScore">0</span></p>
            <button class="btn" onclick="newGame()">다시 시작</button>
        </div>
        
        <div class="controls">
            화살표 키 또는 WASD로 타일 이동<br>
            같은 숫자끼리 합쳐 2048을 만드세요!
        </div>
        
        <div class="btn-group">
            <button class="btn" onclick="newGame()">새 게임</button>
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <script>
        const gridElement = document.getElementById('grid');
        let board = [];
        let score = 0;
        let bestScore = localStorage.getItem('2048BestScore') || 0;
        
        document.getElementById('bestScore').textContent = bestScore;
        
        function initBoard() {
            board = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
            addNewTile();
            addNewTile();
            updateBoard();
        }
        
        function addNewTile() {
            const empty = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (board[r][c] === 0) {
                        empty.push({r, c});
                    }
                }
            }
            
            if (empty.length > 0) {
                const {r, c} = empty[Math.floor(Math.random() * empty.length)];
                board[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        
        function updateBoard() {
            gridElement.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const value = board[r][c];
                    if (value > 0) {
                        cell.textContent = value;
                        cell.classList.add(`tile-${value}`);
                    }
                    gridElement.appendChild(cell);
                }
            }
        }
        
        function move(direction) {
            let moved = false;
            const oldBoard = JSON.stringify(board);
            
            if (direction === 'left' || direction === 'right') {
                for (let r = 0; r < 4; r++) {
                    const row = direction === 'left' ? board[r] : [...board[r]].reverse();
                    const newRow = slide(row);
                    board[r] = direction === 'left' ? newRow : newRow.reverse();
                }
            } else {
                for (let c = 0; c < 4; c++) {
                    const col = [];
                    for (let r = 0; r < 4; r++) {
                        col.push(board[r][c]);
                    }
                    const newCol = direction === 'up' ? slide(col) : slide([...col].reverse()).reverse();
                    for (let r = 0; r < 4; r++) {
                        board[r][c] = newCol[r];
                    }
                }
            }
            
            if (oldBoard !== JSON.stringify(board)) {
                addNewTile();
                updateBoard();
                
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('2048BestScore', bestScore);
                    document.getElementById('bestScore').textContent = bestScore;
                }
                
                if (isGameOver()) {
                    document.getElementById('finalScore').textContent = score;
                    document.getElementById('gameOver').style.display = 'block';
                }
            }
        }
        
        function slide(row) {
            let arr = row.filter(val => val);
            let missing = 4 - arr.length;
            let zeros = Array(missing).fill(0);
            arr = arr.concat(zeros);
            
            for (let i = 0; i < 3; i++) {
                if (arr[i] > 0 && arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    document.getElementById('score').textContent = score;
                    arr[i + 1] = 0;
                }
            }
            
            arr = arr.filter(val => val);
            missing = 4 - arr.length;
            zeros = Array(missing).fill(0);
            arr = arr.concat(zeros);
            
            return arr;
        }
        
        function isGameOver() {
            // 빈 칸이 있으면 게임 계속
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (board[r][c] === 0) return false;
                }
            }
            
            // 합칠 수 있는 타일이 있으면 게임 계속
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (c < 3 && board[r][c] === board[r][c + 1]) return false;
                    if (r < 3 && board[r][c] === board[r + 1][c]) return false;
                }
            }
            
            return true;
        }
        
        function newGame() {
            initBoard();
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                move('left');
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                e.preventDefault();
                move('right');
            } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                move('up');
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                e.preventDefault();
                move('down');
            }
        });
        
        // 터치 지원
        let touchStartX = 0;
        let touchStartY = 0;
        
        gridElement.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        gridElement.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) move('right');
                else move('left');
            } else {
                if (dy > 0) move('down');
                else move('up');
            }
        });
        
        // 게임 시작
        initBoard();
    </script>
</body>
</html>
