<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메모리 게임</title>
    <script src="../../game-sounds.js"></script>
    <script src="../../game-utils.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 20px 20px 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            font-size: 2em;
            font-weight: 900;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .header-item {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-radius: 15px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            flex: 1;
            min-width: 60px;
        }
        
        .header-item.lives-box {
            flex: 1.8;
        }
        
        .header-item h3 {
            font-size: 0.7em;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .header-item p {
            font-size: 1.3em;
            font-weight: bold;
            white-space: nowrap;
        }
        
        #lives {
            font-size: 1em;
        }
        
        .memory-board {
            display: grid;
            gap: 5px;
            margin: 0 auto 20px;
            perspective: 1000px;
            width: 100%;
            max-width: 400px;
        }
        
        .card {
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s, left 0.5s, top 0.5s;
            user-select: none;
        }
        
        .card.shuffling {
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .card:hover:not(.flipped):not(.matched) {
            transform: scale(1.05);
        }
        
        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card.matched {
            animation: match 0.6s ease-out;
            pointer-events: none;
        }
        
        .card .back,
        .card .front {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            backface-visibility: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .card .back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            font-size: 2em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .card .front {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            transform: rotateY(180deg);
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.4);
            font-size: 2.5em;
        }
        
        .card.matched .front {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            animation: pulse 0.8s ease-in-out;
            box-shadow: 0 0 30px rgba(56, 249, 215, 0.6);
        }
        
        @keyframes match {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.2); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.15); }
        }
        
        .message {
            min-height: 40px;
            font-size: 1.2em;
            color: white;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .loading-dots {
            display: inline-flex;
            gap: 5px;
        }
        
        .loading-dots span {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .game-header {
                gap: 5px;
            }
            
            .header-item {
                padding: 8px 10px;
                min-width: 50px;
            }
            
            .header-item.lives-box {
                flex: 2;
            }
            
            .header-item h3 {
                font-size: 0.65em;
            }
            
            .header-item p {
                font-size: 1.1em;
            }
            
            .card .back {
                font-size: 1.5em;
            }
            
            .card .front {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 메모리 게임</h1>
        
        <div id="scoreBoard"></div>
        
        <div class="message" id="message">
            🧠 <span id="messageText">준비 중</span>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="memory-board" id="board"></div>
        
        <div class="btn-group">
            <button class="btn" id="startBtn" onclick="startGame()">게임 시작</button>
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <script>
        const sounds = new GameSounds();
        const emojis = ['🍎', '🍌', '🍇', '🍊', '🍓', '🍒', '🍑', '🥝', '🍋', '🥥', '🍉', '🍍'];
        
        let stage = 1;
        let bestStage = GameUtils.getScore('memory', 'bestStage', 1);
        let lives = 5;
        let maxLives = 5;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let canFlip = false;
        let isShuffling = false;
        let combo = 0; // 연속 매칭 콤보
        
        // 점수판 생성 (GameUI)
        const scoreBoard = GameUI.createScoreBoard({
            items: [
                { id: 'stage', label: '단계', value: 1 },
                { id: 'bestStage', label: '최고', value: bestStage },
                { id: 'lives', label: '목숨', value: '❤️❤️❤️❤️❤️', wide: true }
            ],
            containerId: 'scoreBoard'
        });
        
        const stageConfig = {
            1: { cols: 4, rows: 2, pairs: 4 },    // 4x2, 8카드 (4쌍)
            2: { cols: 4, rows: 4, pairs: 8 },    // 4x4, 16카드 (8쌍)
            3: { cols: 4, rows: 6, pairs: 12 }    // 4x6, 24카드 (12쌍)
        };
        
        function startGame() {
            stage = 1;
            lives = 5;
            combo = 0;
            updateUI();
            
            // 플레이 추적
            GameUtils.trackPlay('memory');
            GameUtils.startTimer('memory');
            
            startStage();
        }
        
        function startStage() {
            const config = stageConfig[stage];
            const cols = config.cols;
            const rows = config.rows;
            const pairCount = config.pairs;
            
            // 카드 생성
            const selectedEmojis = GameUtils.shuffle([...emojis]).slice(0, pairCount);
            cards = GameUtils.shuffle([...selectedEmojis, ...selectedEmojis]);
            
            // 빈 칸 추가 (홀수개일 때)
            const totalCells = cols * rows;
            while (cards.length < totalCells) {
                cards.push(null);
            }
            
            matchedPairs = 0;
            flippedCards = [];
            
            renderBoard(cols, rows);
            
            // 2초간 카드 공개
            showAllCards();
        }
        
        function renderBoard(cols, rows) {
            const board = document.getElementById('board');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            board.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
            
            cards.forEach((emoji, index) => {
                if (emoji === null) {
                    const empty = document.createElement('div');
                    board.appendChild(empty);
                    return;
                }
                
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.emoji = emoji;
                
                card.innerHTML = `
                    <div class="back">?</div>
                    <div class="front">${emoji}</div>
                `;
                
                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
        }
        
        function setMessage(text, showLoading = false) {
            const messageText = document.getElementById('messageText');
            const loadingDots = document.querySelector('.loading-dots');
            
            messageText.textContent = text;
            loadingDots.style.display = showLoading ? 'inline-flex' : 'none';
        }
        
        function showAllCards() {
            setMessage('카드를 기억하세요!', false);
            canFlip = false;
            
            document.querySelectorAll('.card').forEach(card => {
                card.classList.add('flipped');
            });
            
            setTimeout(() => {
                document.querySelectorAll('.card').forEach(card => {
                    if (!card.classList.contains('matched')) {
                        card.classList.remove('flipped');
                    }
                });
                
                canFlip = true;
                setMessage('짝을 맞춰보세요!', false);
                
                // 4단계 이상이면 섞기
                const config = stageConfig[stage];
                if (config.shuffle) {
                    setTimeout(() => shuffleCards(config.shuffle), 1000);
                }
            }, 2000);
        }
        
        function shuffleCards(count) {
            if (isShuffling) return;
            isShuffling = true;
            canFlip = false;
            
            setMessage('카드 섞는 중', true);
            sounds.play('pop');
            
            const board = document.getElementById('board');
            const cardElements = Array.from(board.querySelectorAll('.card'));
            
            // 랜덤하게 카드 선택
            const shuffled = GameUtils.shuffle([...cardElements]).slice(0, count);
            
            shuffled.forEach(card => {
                card.classList.add('shuffling');
            });
            
            setTimeout(() => {
                // 위치 섞기
                const positions = shuffled.map(c => ({
                    index: c.dataset.index,
                    emoji: c.dataset.emoji
                }));
                
                GameUtils.shuffle(positions);
                
                shuffled.forEach((card, i) => {
                    card.dataset.index = positions[i].index;
                    card.dataset.emoji = positions[i].emoji;
                    card.querySelector('.front').textContent = positions[i].emoji;
                });
                
                setTimeout(() => {
                    shuffled.forEach(card => {
                        card.classList.remove('shuffling');
                    });
                    
                    isShuffling = false;
                    canFlip = true;
                    setMessage('짝을 맞춰보세요!', false);
                }, 800);
            }, 500);
        }
        
        function flipCard(card) {
            if (!canFlip || isShuffling) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
            if (flippedCards.length >= 2) return;
            
            card.classList.add('flipped');
            flippedCards.push(card);
            sounds.play('flip');
            vibrate(20);
            
            if (flippedCards.length === 2) {
                canFlip = false;
                checkMatch();
            }
        }
        
        function checkMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.dataset.emoji === card2.dataset.emoji) {
                // 매치!
                combo++;
                
                // 콤보에 따른 사운드/진동
                if (combo >= 3) {
                    sounds.play('powerup');
                    vibrate([100, 50, 100]);
                    setMessage(`🔥 ${combo} 콤보!`, false);
                } else {
                    sounds.play('match');
                    vibrate([50, 30, 50]);
                }
                
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    
                    matchedPairs++;
                    flippedCards = [];
                    canFlip = true;
                    
                    checkStageComplete();
                }, 500);
            } else {
                // 틀림!
                combo = 0; // 콤보 리셋
                sounds.play('wrong');
                vibrate(100);
                
                lives--;
                updateUI();
                
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                    
                    if (lives <= 0) {
                        gameOver();
                    }
                }, 1000);
            }
        }
        
        function checkStageComplete() {
            const config = stageConfig[stage];
            if (matchedPairs === config.pairs) {
                sounds.play('victory');
                vibrate([100, 50, 100, 50, 200]);
                
                // 목숨 추가
                if (lives < maxLives) {
                    lives++;
                }
                
                stage++;
                
                if (stage > bestStage) {
                    bestStage = stage;
                    GameUtils.saveScore('memory', 'bestStage', bestStage);
                }
                
                updateUI();
                
                if (stage > 3) {
                    showModal('🎉 모든 단계 클리어!', stage - 1, lives, bestStage, true);
                } else {
                    setMessage(`${stage-1}단계 클리어!`, false);
                    
                    setTimeout(() => {
                        startStage();
                    }, 2000);
                }
            }
        }
        
        function gameOver() {
            sounds.play('gameover');
            vibrate([100, 50, 100, 50, 200]);
            
            canFlip = false;
            setMessage('게임 오버!', false);
            
            setTimeout(() => {
                showModal('💀 게임 오버!', stage, lives, bestStage, false);
            }, 1000);
        }
        
        function showModal(title, finalStage, finalLives, finalBest, isVictory) {
            GameUtils.createModal({
                title: title,
                stats: [
                    { label: '최종 단계', value: finalStage },
                    { label: '남은 목숨', value: finalLives },
                    { label: '최고 단계', value: finalBest }
                ],
                buttons: [
                    {
                        text: '📱 카톡 공유',
                        action: () => {
                            const text = `🧠 메모리 게임\n\n최종: ${finalStage}\n목숨: ${finalLives}❤️\n최고: ${finalBest}\n\nhttps://oringnam.github.io/minigames/`;
                            GameUtils.copyToClipboard(text);
                        }
                    },
                    {
                        text: '다시 하기',
                        action: () => {
                            stage = 1;
                            lives = 5;
                            updateUI();
                            setMessage('준비 중', true);
                        }
                    }
                ]
            });
        }
        
        function updateUI() {
            scoreBoard.update('stage', stage);
            scoreBoard.update('bestStage', bestStage);
            scoreBoard.update('lives', '❤️'.repeat(lives));
        }
    </script>
</body>
</html>
