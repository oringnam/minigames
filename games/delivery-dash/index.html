<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070a12">
    <title>🚚 Delivery Dash</title>
    <script src="../../game-sounds.js"></script>
    <script src="../../game-utils.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(1200px 700px at 60% 40%, #111a3a 0%, #070a12 60%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1vh 2vw;
            color: #e8eefc;
            overflow: hidden;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 1.5vh 2vw;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1);
            text-align: center;
            max-width: 95vw;
            max-height: 98vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        h1 {
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 1vh;
            font-size: clamp(1.2em, 4vw, 1.8em);
            font-weight: 900;
            flex-shrink: 0;
        }
        
        #game-wrap {
            position: relative;
            margin: 0.5vh 0;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }
        
        /* Score board */
        #scoreBoard {
            flex-shrink: 0;
            margin-bottom: 1vh;
        }
        
        /* HUD overlay for toast only */
        #hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            width: 90%;
        }
        
        #toast {
            min-height: 24px;
            color: rgba(255, 255, 255, 0.95);
            font-size: clamp(12px, 2.5vw, 14px);
            text-align: center;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
            background: rgba(14, 19, 35, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 1vh 2vw;
        }
        
        #game {
            width: 100%;
            max-width: min(90vw, 60vh);
            height: auto;
            aspect-ratio: 9 / 16;
            display: block;
            background: linear-gradient(180deg, rgba(10,14,30,0.8), rgba(7,10,18,0.95));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            touch-action: none;
            margin: 0 auto;
        }
        
        /* Mobile controls */
        .controls {
            width: 100%;
            max-width: min(90vw, 60vh);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5vw;
            margin: 1vh auto 0;
            flex-shrink: 0;
        }
        
        .pad-left {
            position: relative;
            width: 35vw;
            height: 14vh;
            max-width: 200px;
            max-height: 150px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(14, 19, 35, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 34px rgba(0,0,0,0.4);
            touch-action: none;
            user-select: none;
        }
        
        .stick-base {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 80%;
            height: 80%;
            max-width: 140px;
            max-height: 140px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .stick-knob {
            --dx: 0px;
            --dy: 0px;
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(15vw, 60px);
            height: min(15vw, 60px);
            transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)));
            border-radius: 50%;
            background: rgba(86, 240, 194, 0.2);
            border: 2px solid rgba(86, 240, 194, 0.6);
            box-shadow: 0 10px 26px rgba(0,0,0,0.4);
        }
        
        .pad-label {
            position: absolute;
            left: 2vw;
            bottom: 1vh;
            font-size: clamp(10px, 2vw, 11px);
            letter-spacing: 0.12em;
            color: rgba(232, 238, 252, 0.7);
        }
        
        .pad-dash {
            width: 35vw;
            height: 14vh;
            max-width: 200px;
            max-height: 150px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(14, 19, 35, 0.5);
            backdrop-filter: blur(10px);
            color: rgba(232, 238, 252, 0.9);
            font-weight: 800;
            font-size: clamp(15px, 3.5vw, 18px);
            letter-spacing: 0.06em;
            box-shadow: 0 12px 34px rgba(0,0,0,0.4);
            touch-action: none;
            cursor: pointer;
        }
        
        .pad-dash:active {
            transform: translateY(1px);
        }
        
        .pad-dash.ready {
            border-color: rgba(86, 240, 194, 0.6);
            background: rgba(86, 240, 194, 0.15);
        }
        
        .pad-dash.cooldown {
            opacity: 0.75;
        }
        
        @media (pointer: fine) {
            /* Desktop: hide controls, landscape canvas */
            .controls {
                display: none;
            }
            
            #game {
                aspect-ratio: 16/9;
                max-width: min(85vw, 140vh);
                max-height: 80vh;
            }
            
            body {
                justify-content: center;
            }
        }
        
        @media (max-height: 700px) {
            /* Very short screens: reduce everything */
            h1 {
                font-size: clamp(1em, 3vw, 1.5em);
                margin-bottom: 0.5vh;
            }
            
            .container {
                padding: 1vh 2vw;
            }
            
            .pad-left, .pad-dash {
                height: 12vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚚 Delivery Dash</h1>
        
        <!-- Score board (GameUI) -->
        <div id="scoreBoard"></div>
        
        <div id="game-wrap">
            <!-- Toast overlay -->
            <div id="hud" aria-hidden="true">
                <div id="toast"></div>
            </div>
            
            <!-- Game canvas -->
            <canvas id="game" width="540" height="960" aria-label="Delivery Dash"></canvas>
        </div>
        
        <!-- Mobile controls -->
        <div id="controls" class="controls" aria-hidden="true">
            <div id="pad-left" class="pad-left" aria-label="Move">
                <div class="stick-base" aria-hidden="true">
                    <div id="stick-knob" class="stick-knob" aria-hidden="true"></div>
                </div>
                <div class="pad-label" aria-hidden="true">MOVE</div>
            </div>
            
            <button id="pad-dash" class="pad-dash" type="button" aria-label="Dash">DASH</button>
        </div>
        
        <div class="btn-group">
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
