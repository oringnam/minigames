<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070a12">
    <title>🚚 Delivery Dash</title>
    <script src="../../game-sounds.js"></script>
    <script src="../../game-utils.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(1200px 700px at 60% 40%, #111a3a 0%, #070a12 60%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 20px 20px 20px;
            color: #e8eefc;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 15px 20px;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            font-size: 1.8em;
            font-weight: 900;
        }
        
        #game-wrap {
            position: relative;
            margin: 10px 0;
        }
        
        /* Score board */
        #scoreBoard {
            margin-bottom: 15px;
        }
        
        /* HUD overlay for toast only */
        #hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            width: 90%;
        }
        
        #toast {
            min-height: 24px;
            color: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            text-align: center;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
            background: rgba(14, 19, 35, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 10px 15px;
        }
        
        #game {
            width: 100%;
            max-width: 420px;
            height: auto;
            aspect-ratio: 9 / 16;
            display: block;
            background: linear-gradient(180deg, rgba(10,14,30,0.8), rgba(7,10,18,0.95));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            touch-action: none;
            margin: 0 auto;
        }
        
        /* Mobile controls */
        .controls {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 10px auto 0;
        }
        
        .pad-left {
            position: relative;
            width: clamp(140px, 36vw, 180px);
            height: clamp(110px, 28vw, 140px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(14, 19, 35, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 34px rgba(0,0,0,0.4);
            touch-action: none;
            user-select: none;
        }
        
        .stick-base {
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(95px, 26vw, 125px);
            height: clamp(95px, 26vw, 125px);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .stick-knob {
            --dx: 0px;
            --dy: 0px;
            position: absolute;
            left: 50%;
            top: 50%;
            width: 55px;
            height: 55px;
            transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)));
            border-radius: 50%;
            background: rgba(86, 240, 194, 0.2);
            border: 2px solid rgba(86, 240, 194, 0.6);
            box-shadow: 0 10px 26px rgba(0,0,0,0.4);
        }
        
        .pad-label {
            position: absolute;
            left: 10px;
            bottom: 8px;
            font-size: 11px;
            letter-spacing: 0.12em;
            color: rgba(232, 238, 252, 0.7);
        }
        
        .pad-dash {
            width: clamp(110px, 28vw, 160px);
            height: clamp(110px, 28vw, 140px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(14, 19, 35, 0.5);
            backdrop-filter: blur(10px);
            color: rgba(232, 238, 252, 0.9);
            font-weight: 800;
            font-size: 17px;
            letter-spacing: 0.06em;
            box-shadow: 0 12px 34px rgba(0,0,0,0.4);
            touch-action: none;
            cursor: pointer;
        }
        
        .pad-dash:active {
            transform: translateY(1px);
        }
        
        .pad-dash.ready {
            border-color: rgba(86, 240, 194, 0.6);
            background: rgba(86, 240, 194, 0.15);
        }
        
        .pad-dash.cooldown {
            opacity: 0.75;
        }
        
        @media (pointer: fine) {
            /* Desktop: hide controls, landscape canvas */
            .controls {
                display: none;
            }
            
            #game {
                aspect-ratio: 16/9;
                max-width: 720px;
                max-height: 85vh;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.5em;
                margin-bottom: 10px;
            }
            
            #game {
                max-width: 380px;
            }
            
            .controls {
                max-width: 380px;
            }
        }
        
        @media (max-width: 400px) {
            #game {
                max-width: 340px;
            }
            
            .controls {
                max-width: 340px;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚚 Delivery Dash</h1>
        
        <!-- Score board (GameUI) -->
        <div id="scoreBoard"></div>
        
        <div id="game-wrap">
            <!-- Toast overlay -->
            <div id="hud" aria-hidden="true">
                <div id="toast"></div>
            </div>
            
            <!-- Game canvas -->
            <canvas id="game" width="540" height="960" aria-label="Delivery Dash"></canvas>
        </div>
        
        <!-- Mobile controls -->
        <div id="controls" class="controls" aria-hidden="true">
            <div id="pad-left" class="pad-left" aria-label="Move">
                <div class="stick-base" aria-hidden="true">
                    <div id="stick-knob" class="stick-knob" aria-hidden="true"></div>
                </div>
                <div class="pad-label" aria-hidden="true">MOVE</div>
            </div>
            
            <button id="pad-dash" class="pad-dash" type="button" aria-label="Dash">DASH</button>
        </div>
        
        <div class="btn-group">
            <a href="../../index.html" class="btn">← 메인으로</a>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
